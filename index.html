<script>
'use strict';
/* =========================================================
   1. TIỆN ÍCH
   ========================================================= */
const CFG = window.FC_CONFIG || {};
const MODE = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) ? 'cloud' : 'demo';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const num = v => { if (v === null || v === undefined || v === '') return 0; const n = Number(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const nf0 = new Intl.NumberFormat('vi-VN', {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat('vi-VN', {maximumFractionDigits: 1, minimumFractionDigits: 1});
const nf2 = new Intl.NumberFormat('vi-VN', {maximumFractionDigits: 2, minimumFractionDigits: 2});

  async approveMapping(ids){ const {error} = await this.sb.from('mapping').update({status: 'active'}).in('id', ids); if (error) throw error; }
  async updateMappingRow(id, patch){ const {error} = await this.sb.from('mapping').update(patch).eq('id', id); if (error) throw error; }

let P = [], PK = '', MS = [], MST = [], ROWS = [], SQ = new Map(), PRICE = new Map(), RULE = {pct: .5, min: 2e7}, TGT_OPEN = [], TIME_GONE = 0;

function derive(r){
  const f = r.f || {}; const pr = r.price || 0;

  r.fcvM = boxes.map(b => b * pr); r.fcv = r.box * pr;

    if (!r.baseV) r.flag = 'Có FC nhưng 2 quý gần nhất không có sales';
    else if (!r.fcv) r.flag = 'FC = 0 trong khi đang có sales';
    else { const dv = r.fcv / r.baseV - 1; if (Math.abs(dv) > RULE.pct) r.flag = `FC ${dv > 0 ? 'cao' : 'thấp'} hơn ${pct(Math.abs(dv))} so với TB 2 quý gần nhất`; }

function agg(rows){

function readWorkbook(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = e => { try { res(XLSX.read(new Uint8Array(e.target.result), {type: 'array', cellDates: false})); } catch(err){ rej(err); } }; fr.onerror = rej; fr.readAsArrayBuffer(file); }); }
function sheetRows(ws){ return XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: null, blankrows: false}); }
function findHeader(rows, mustHave){ for (let i = 0; i < Math.min(rows.length, 30); i++){ const r = (rows[i] || []).map(lc); if (mustHave.every(h => r.includes(lc(h)))) return i; } return -1; }
function colIdx(hdr, names){ const h = hdr.map(lc); for (const n of names){ const i = h.indexOf(lc(n)); if (i >= 0) return i; } return -1; }
function findSheet(wb, prefer, mustHave){ for (const n of [...prefer, ...wb.SheetNames]){ if (!wb.Sheets[n]) continue; const rows = sheetRows(wb.Sheets[n]); const hi = findHeader(rows, mustHave); if (hi >= 0) return {rows, hi, hdr: rows[hi]}; } return null; }

async function importPrices(file, log){

  if (!n) throw new Error('File không có dòng giá nào');
  await STORE.savePrices([...prices.values()]); log(`Cập nhật ${n} SKU. Bảng giá hiện có ${prices.size} SKU.`);
}
async function importSales(file, log){
  const wb = await readWorkbook(file); const f = findSheet(wb, [], ['Customer Code', 'Net Sales Value', 'Year']);
  if (!f) throw new Error('Không tìm thấy dòng tiêu đề có Customer Code, Net Sales Value, Year');
  const h = f.hdr; const c = {code: colIdx(h, ['Customer Code']), name: colIdx(h, ['Customer Name']), sku: colIdx(h, ['SKU_Name', 'SKU']), val: colIdx(h, ['Net Sales Value']), qty: colIdx(h, ['Commercial Quantity', 'Quantity']), y: colIdx(h, ['Year']), m: colIdx(h, ['Month']), q: colIdx(h, ['Quarter']), date: colIdx(h, ['Invoice Confirmed Date', 'Invoice Date']), rep: colIdx(h, ['REP Name']), team: colIdx(h, ['REP Group'])};
  if (c.sku < 0) throw new Error('Thiếu cột SKU_Name'); if (c.m < 0 && c.date < 0) throw new Error('Thiếu cột Month (hoặc Invoice Confirmed Date)');
  const skus = new Set([...D.prices.map(p => p.sku), ...D.mapping.map(m => m.sku)]); if (!skus.size) throw new Error('Chưa có danh sách SKU: nạp Bảng giá (bước 1) hoặc danh sách account (bước 2) trước.');
  const kws = norm(D.settings.exclude_keywords).split(','); const team = lc(D.settings.team_filter || 'CVRM');
  const ag = new Map(); const seen = new Map(); const qt = new Map(); let n = 0, skip = 0, maxD = null;
  for (let i = f.hi + 1; i < f.rows.length; i++){
    const r = f.rows[i]; const y = num(r[c.y]); const dt = c.date >= 0 ? excelDate(r[c.date]) : null; const mo = c.m >= 0 && num(r[c.m]) ? num(r[c.m]) : (dt ? dt.getMonth() + 1 : 0);
    if (!r[c.code] || !y || !mo){ skip++; continue; } n++;
    if (dt && (!maxD || dt > maxD)) maxD = dt;
    const sku = norm(r[c.sku]); if (!skus.has(sku)) continue;
    const code = norm(r[c.code]); const v = num(r[c.val]); const qn = c.qty >= 0 ? num(r[c.qty]) : 0; const k = `${code}|${sku}|${y}|${mo}`; const o = ag.get(k) || [0, 0]; o[0] += v; o[1] += qn; ag.set(k, o);
    const isTeam = c.team < 0 || lc(r[c.team]) === team; const qk = y * 4 + Math.floor((mo - 1) / 3) + 1;
    if (isTeam) qt.set(qk, (qt.get(qk) || 0) + v);
    const rep = c.rep >= 0 ? norm(r[c.rep]) : '';
    if (isTeam && isAssigned(rep, kws)){ const sk = `${code}|${sku}`; const s = seen.get(sk) || {cust_code: code, sku, cust_name: norm(r[c.name]), rep_name: rep, value: 0, _t: 0}; s.value += v; const t = y * 12 + mo; if (t >= s._t){ s._t = t; s.rep_name = rep; s.cust_name = norm(r[c.name]) || s.cust_name; } seen.set(sk, s); }
  }
  const rows = [...ag].map(([k, [value, qty]]) => { const [cust_code, sku, year, month] = k.split('|'); return {cust_code, sku, year: +year, month: +month, value, qty}; });
  const seenRows = [...seen.values()].map(({_t, ...o}) => o);
  await STORE.replaceSales(rows, seenRows); if (maxD) await STORE.saveSettings({data_as_of: isoDate(maxD)});
  log(`Đọc ${nf0.format(n)} dòng (bỏ ${skip} dòng Total/trống). Lưu ${nf0.format(rows.length)} dòng (khách × SKU × tháng).${maxD ? ` Sales đến ${maxD.toLocaleDateString('vi-VN')}.` : ''}\nDoanh số team ${D.settings.team_filter}: ${[...qt].sort((x, y) => x[0] - y[0]).map(([k, val]) => `${qlabel(Math.floor((k - 1) / 4), (k - 1) % 4 + 1)} ${big(val)}`).join(' · ')}`);
}
async function importAccounts(file, withFC, delMissing, log){
  const wb = await readWorkbook(file); const f = findSheet(wb, ['Account', 'FC Input', 'FC Sale'], ['REP Name', 'Cust Code']); if (!f) throw new Error('Không thấy sheet có cột REP Name, Cust Code');
  const h = f.hdr; const c = {rep: colIdx(h, ['REP Name']), code: colIdx(h, ['Cust Code']), name: colIdx(h, ['Cust Name']), brand: colIdx(h, ['Brand']), sku: colIdx(h, ['SKU', 'SKUs']), ratio: colIdx(h, ['Sales ratio']), ch: colIdx(h, ['Kênh', 'Tender/Sefl-pay', 'Tender/Self-pay']),
    m1: colIdx(h, ['FC tháng 1 (box)', 'FC Oct (box)', 'FC Jan (box)', 'FC Apr (box)', 'FC Jul (box)', 'FC July (box)']), m2: colIdx(h, ['FC tháng 2 (box)', 'FC Nov (box)', 'FC Feb (box)', 'FC May (box)', 'FC Aug (box)']), m3: colIdx(h, ['FC tháng 3 (box)', 'FC Dec (Box)', 'FC Dec (box)', 'FC Mar (box)', 'FC Jun (box)', 'FC June (box)', 'FC Sep (box)']), note: colIdx(h, ['Ghi chú', 'Note2']), reason: colIdx(h, ['Lý do'])};

    out.push(m); const vv = k => (c[k] >= 0 && r[c[k]] !== null && r[c[k]] !== '') ? Math.round(num(r[c[k]])) : null;
    fcv.push({key: `${m.rep_name}|${m.cust_code}|${m.sku}`, m1: vv('m1'), m2: vv('m2'), m3: vv('m3'), note: c.note >= 0 ? norm(r[c.note]) : '', reason: c.reason >= 0 ? norm(r[c.reason]) || null : null}); }
  let nPrice = 0; const st = findSheet(wb, ['Setup'], ['SKU', 'Giá/box (VND)']);
  if (st && wb.Sheets['Setup']){ const ci = {b: colIdx(st.hdr, ['Brand']), s: colIdx(st.hdr, ['SKU']), p: colIdx(st.hdr, ['Giá/box (VND)'])}; const prices = new Map(D.prices.map(x => [x.sku, x]));
    for (let i = st.hi + 1; i < st.rows.length; i++){ const r = st.rows[i] || []; const sku = norm(r[ci.s]); if (!sku) break; const pr = num(r[ci.p]); if (!pr) continue; prices.set(sku, {sku, brand: norm(r[ci.b]).toUpperCase() || brandOf(sku), price: pr}); nPrice++; }
    if (nPrice) await STORE.savePrices([...prices.values()]); }
  const mapping = await STORE.upsertMapping(out, delMissing); D.mapping = mapping;
  let nfc = 0;
  if (withFC){ const id = new Map(mapping.map(m => [`${m.rep_name}|${m.cust_code}|${m.sku}`, m.id])); const list = fcv.filter(x => x.m1 !== null || x.m2 !== null || x.m3 !== null || x.note).map(x => ({mapping_id: id.get(x.key), m1: x.m1, m2: x.m2, m3: x.m3, note: x.note, reason: x.reason})).filter(x => x.mapping_id); if (list.length) await STORE.upsertFC(PK, list); nfc = list.length; }
  log(`Account: ${out.length} dòng, ${new Set(out.map(r => r.rep_name)).size} MR, ${new Set(out.map(r => r.cust_code)).size} account.${nPrice ? ` Cập nhật giá ${nPrice} SKU từ sheet Setup.` : ''}${withFC && nfc ? ` Nạp FC cho ${nfc} dòng vào kỳ ${P[4].label}.` : ''}`);
}

async function importTargets(file, opts, log){
  const wb = await readWorkbook(file);
  const fp = normPeriod(file.name); if (fp && fp !== PK) throw new Error(`File là target ${pkLabel(fp)} nhưng kỳ FC đang mở là ${P[4].label}. Đổi kỳ ở mục Kỳ FC trước.`);
  const skus = new Set([...D.prices.map(p => p.sku), ...D.mapping.map(m => m.sku)]);
  // 1) File phân bổ target của Bayer (sheet Account / Target by account): có REP → target theo MR
  let f = findSheet(wb, ['Account', 'Target by account'], ['REP', 'Cus. Code', 'Product Name', 'Final Target']); let c, byRep = true;
  if (f) c = {rep: colIdx(f.hdr, ['REP']), code: colIdx(f.hdr, ['Cus. Code']), name: colIdx(f.hdr, ['Account']), sku: colIdx(f.hdr, ['Product Name']), v: colIdx(f.hdr, ['Final Target']), q: colIdx(f.hdr, ['Volume Target'])};
  else { byRep = false; f = findSheet(wb, ['Target'], ['Cust Code', 'SKU']); if (f) c = {rep: -1, code: colIdx(f.hdr, ['Cust Code']), name: colIdx(f.hdr, ['Cust Name', 'Account', 'Account (tham khảo)']), sku: colIdx(f.hdr, ['SKU']), v: colIdx(f.hdr, ['Target quý FC (VND)', 'Target', 'Final Target']), q: colIdx(f.hdr, ['Volume Target', 'Target (box)'])}; }
  if (!f || c.v < 0) throw new Error('Không thấy cột target (Final Target hoặc Target quý FC (VND))');
  const raw = []; let other = 0;
  for (let i = f.hi + 1; i < f.rows.length; i++){ const r = f.rows[i]; if (!r || !r[c.code] || !r[c.sku]) continue; const sku = norm(r[c.sku]); if (skus.size && !skus.has(sku)){ other++; continue; }
    raw.push({rep: c.rep >= 0 ? norm(r[c.rep]) : '', cust_code: norm(r[c.code]), cust_name: c.name >= 0 ? norm(r[c.name]) : '', sku, value: num(r[c.v]), qty: c.q >= 0 ? num(r[c.q]) : 0}); }
  if (!raw.length) throw new Error('File không có dòng target nào cho các SKU trong bảng giá');
  // 2) Khớp tên REP với MR trong app
  const known = [...new Set([...D.members.filter(m => m.role === 'MR').map(m => m.rep_name), ...D.mapping.map(m => m.rep_name)])].sort(); const knownLc = new Map(known.map(k => [lc(k), k]));
  const alias = {};
  if (byRep){ const unk = new Map(); raw.forEach(t => { if (t.rep && !knownLc.has(lc(t.rep))){ const o = unk.get(t.rep) || {name: t.rep, n: 0, v: 0}; o.n++; o.v += t.value; unk.set(t.rep, o); } });
    if (unk.size){ const m = await repDialog([...unk.values()], known); if (!m) throw new Error('Đã hủy nạp target'); Object.assign(alias, m); } }
  const repOf = t => { if (!t.rep) return ''; if (knownLc.has(lc(t.rep))) return knownLc.get(lc(t.rep)); return alias[t.rep] === undefined ? t.rep : (alias[t.rep] || t.rep); };
  const unassigned = new Set(Object.entries(alias).filter(([k, v]) => !v).map(([k]) => k));
  const agg2 = new Map(); for (const t of raw){ const rep = repOf(t); const k = `${rep}|${t.cust_code}|${t.sku}`; const o = agg2.get(k) || {rep_name: rep, cust_code: t.cust_code, cust_name: t.cust_name, sku: t.sku, value: 0, qty: 0, open: unassigned.has(t.rep)}; o.value += t.value; o.qty += t.qty; agg2.set(k, o); }
  const list = [...agg2.values()];
  await STORE.replaceTargets(PK, list.map(({cust_name, open, ...x}) => x));
  // 3) Đối chiếu với danh sách account × MR
  const mk = new Map(D.mapping.map(m => [`${lc(m.rep_name)}|${m.cust_code}|${m.sku}`, m]));
  const tot = list.reduce((x, t) => x + t.value, 0); const match = list.filter(t => t.rep_name && mk.has(`${lc(t.rep_name)}|${t.cust_code}|${t.sku}`));
  const open = list.filter(t => t.open || !t.rep_name); const miss = list.filter(t => t.rep_name && !t.open && !mk.has(`${lc(t.rep_name)}|${t.cust_code}|${t.sku}`) && t.value);
  const sumV = a => a.reduce((x, t) => x + t.value, 0);
  let made = 0, synced = 0;
  if (byRep && (opts.create || opts.sync)){
    const totK = new Map(); list.forEach(t => totK.set(`${t.cust_code}|${t.sku}`, (totK.get(`${t.cust_code}|${t.sku}`) || 0) + t.value));
    const share = t => { const T = totK.get(`${t.cust_code}|${t.sku}`); return T ? Math.round(t.value / T * 100) / 100 : 1; };
    const rows = [];
    if (opts.create) miss.forEach(t => { const pr = D.prices.find(p => p.sku === t.sku); rows.push({rep_name: t.rep_name, cust_code: t.cust_code, cust_name: t.cust_name || (D.mapping.find(m => m.cust_code === t.cust_code)?.cust_name) || t.cust_code, brand: pr?.brand || brandOf(t.sku), sku: t.sku, ratio: share(t) || 1, channel: D.mapping.find(m => m.cust_code === t.cust_code)?.channel || null, status: 'active'}); made++; });
    if (opts.sync) match.forEach(t => { const m = mk.get(`${lc(t.rep_name)}|${t.cust_code}|${t.sku}`); const sh = share(t); if (sh && Math.abs(num(m.ratio) - sh) > 0.005){ rows.push({...m, ratio: sh}); synced++; } });
    if (rows.length) D.mapping = await STORE.upsertMapping(rows, false);
  }
  const reps = new Set(list.filter(t => t.rep_name && !t.open).map(t => t.rep_name));
  const noLogin = [...reps].filter(r => !D.members.some(m => lc(m.rep_name) === lc(r)));
  log(`Target ${P[4].label}${byRep ? ' theo MR' : ' theo account'}: ${list.length} dòng, tổng ${big(tot)}${other ? ` (bỏ ${other} dòng BU khác)` : ''}.\n`
    + (byRep ? `• Khớp đúng MR × account × SKU: ${big(sumV(match))} (${match.length} dòng)\n• MR có target nhưng chưa có dòng FC: ${big(sumV(miss))} (${miss.length} dòng)${opts.create && made ? ` → đã tạo ${made} dòng` : ''}\n• Chưa giao MR: ${big(sumV(open))} (${open.length} dòng)${synced ? `\n• Cập nhật Sales ratio theo tỷ trọng target: ${synced} dòng` : ''}${noLogin.length ? `\n• MR chưa có tài khoản đăng nhập: ${noLogin.join(', ')}` : ''}` : '• File không có cột REP: target chia cho MR theo Sales ratio.'));

async function importArchive(file, log){

      const known = new Map(repList().map(k => [lc(k), k])); const rows = [];
      for (const t of TGT_OPEN){ const rep = known.get(lc(t.rep_name)); if (!rep) continue; const pr = D.prices.find(p => p.sku === t.sku); rows.push({rep_name: rep, cust_code: t.cust_code, cust_name: D.mapping.find(m => m.cust_code === t.cust_code)?.cust_name || t.cust_code, brand: pr?.brand || brandOf(t.sku), sku: t.sku, ratio: 1, channel: D.mapping.find(m => m.cust_code === t.cust_code)?.channel || null, status: 'active'}); }
      if (!rows.length) return toast('Không có dòng nào thuộc MR đã có trong app (dòng MR trống cần chọn MR khi nạp target)');
      try { await STORE.upsertMapping(rows, false); toast(`Đã tạo ${rows.length} dòng`); await reload(); } catch(e){ toast('Lỗi: ' + e.message); } });
    $('#m-add') && ($('#m-add').onclick = async () => {
      const pick = $$('.m-ck').filter(c => c.checked).map(c => miss[+c.dataset.i]); const add = new Map();
      for (const x of pick){ const b = brandOf(x.sku); for (const p of D.prices.filter(p => p.brand === b)){ const k = `${x.rep_name}|${x.cust_code}|${p.sku}`; if (!D.mapping.some(m => `${m.rep_name}|${m.cust_code}|${m.sku}` === k)) add.set(k, {rep_name: x.rep_name, cust_code: x.cust_code, cust_name: x.cust_name, brand: b, sku: p.sku, ratio: 1, channel: null, status: 'active'}); } }
      try { await STORE.upsertMapping([...add.values()], false); toast(`Đã thêm ${add.size} dòng`); await reload(); } catch(e){ toast('Lỗi: ' + e.message); }
    });
  }
  if (t === 'mapping'){
    const q = VIEW.mapQ || ''; const reps = repList(); const mf = VIEW.mapFlt;
    const list = ROWS.filter(r => (mf === 'warn' ? r.warn : mf === 'prop' ? r.status === 'proposed' : true) && (!q || lc(`${r.cust_name} ${r.cust_code} ${r.rep_name} ${r.sku}`).includes(lc(q))));
    A.innerHTML = `<div class="card"><div class="bar"><input type="search" id="mp-q" placeholder="Tìm account / MR / SKU" value="${esc(q)}"><select id="mp-f"><option value="">Tất cả dòng</option><option value="prop" ${mf === 'prop' ? 'selected' : ''}>Đề xuất chờ duyệt (${prop.length})</option><option value="warn" ${mf === 'warn' ? 'selected' : ''}>Cảnh báo (${warn.length})</option></select>
      ${mf === 'prop' && list.length ? '<button class="btn ok" id="mp-okall">Duyệt tất cả đề xuất</button>' : ''}<span class="grow"></span><span class="sub">${list.length} dòng · sửa MR / ratio / kênh là lưu ngay</span></div>
      <div class="tw"><table class="t"><thead><tr><th class="l">MR</th><th class="l">Account</th><th class="l">Mã</th><th class="l">SKU</th><th>Ratio</th><th class="l">Kênh</th><th class="l">Ghi chú</th><th></th></tr></thead><tbody>
      ${list.slice(0, 400).map(r => `<tr><td class="l"><select data-mid="${r.id}" data-k="rep_name">${reps.map(x => `<option ${x === r.rep_name ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></td><td class="l">${esc(r.cust_name)}</td><td class="l">${esc(r.cust_code)}</td><td class="l">${esc(r.sku)}</td>
        <td><input data-mid="${r.id}" data-k="ratio" value="${num(r.ratio)}" style="width:60px;text-align:right"></td><td class="l"><select data-mid="${r.id}" data-k="channel">${['', 'Tender', 'Self-pay', 'Other'].map(x => `<option ${x === (r.channel || '') ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
        <td class="l">${r.status === 'proposed' ? `<span class="chip pp">đề xuất</span> <span class="sub" data-tip="${esc(r.proposed_by || '')}">${esc(r.proposed_note || '')}</span>` : `<span class="warn">${r.warn}</span>`}</td>
        <td>${r.status === 'proposed' ? `<button class="btn sm ok" data-okp="${r.id}">Duyệt</button> ` : ''}<button class="btn sm danger" data-del="${r.id}">Xóa</button></td></tr>`).join('')}</tbody></table></div>${list.length > 400 ? '<div class="sub">Hiện 400 dòng đầu, dùng ô tìm để lọc.</div>' : ''}</div>`;
    let qt; $('#mp-q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { VIEW.mapQ = e.target.value; viewAdmin(); const el = $('#mp-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 350); };
    $('#mp-f').onchange = e => { VIEW.mapFlt = e.target.value; viewAdmin(); };
    $('#mp-okall') && ($('#mp-okall').onclick = async () => { try { await STORE.approveMapping(prop.map(r => r.id)); toast(`Đã duyệt ${prop.length} dòng`); await reload(); } catch(e){ toast('Lỗi: ' + e.message); } });
    A.addEventListener('change', async e => { const el = e.target; if (!el.dataset.mid) return; const id = +el.dataset.mid; const k = el.dataset.k; const val = k === 'ratio' ? num(el.value) : (el.value || null); try { await STORE.updateMappingRow(id, {[k]: val}); const m = D.mapping.find(x => x.id === id); m[k] = val; build(); toast('Đã lưu'); } catch(err){ toast('Lỗi: ' + err.message); } });
    A.addEventListener('click', async e => {
      const okp = e.target.dataset.okp; if (okp){ try { await STORE.approveMapping([+okp]); toast('Đã duyệt'); await reload(); } catch(err){ toast('Lỗi: ' + err.message); } return; }
      const id = e.target.dataset.del; if (!id) return; if (!await confirmBox('Xóa dòng này? FC đã nhập của dòng cũng bị xóa.')) return; try { await STORE.deleteMappingRows([+id]); await reload(); } catch(err){ toast('Lỗi: ' + err.message); } });
  }
  if (t === 'members'){
    A.innerHTML = `<div class="adm"><div class="card"><h3>Thành viên (đăng nhập)</h3><div class="sub" style="margin-bottom:8px">Tên MR phải trùng REP Name trong danh sách account. Vai trò: MR (nhập FC của mình), RFFM (xem + duyệt), ADMIN (toàn quyền).</div>
      <div class="tw" style="max-height:420px"><table class="t"><thead><tr><th class="l">Email</th><th class="l">Tên</th><th class="l">Vai trò</th><th></th></tr></thead><tbody id="mb">${D.members.map(m => memRow(m)).join('')}</tbody></table></div>
      <div class="bar" style="margin-top:8px"><button class="btn" id="mb-add">+ Thêm</button><button class="btn" id="mb-fill">+ Thêm MR còn thiếu từ danh sách account</button><span class="grow"></span><button class="btn pri" id="mb-save">Lưu</button></div>
      <details style="margin-top:6px"><summary class="sub" style="cursor:pointer">Dán cả danh sách từ Excel (Email | Tên MR | Vai trò)</summary><textarea id="mb-paste" rows="6" class="inp" style="margin-top:6px" placeholder="email@bayer.com&#9;Nguyen Van A&#9;MR"></textarea><button class="btn sm" id="mb-parse" style="margin-top:6px">Đưa vào bảng</button></details>
      ${MODE === 'cloud' ? '<div class="sub" style="margin-top:8px">Sau khi lưu: tạo tài khoản đăng nhập cho email đó trong Supabase → Authentication → Users → Add user → Create new user (tick Auto Confirm), đặt mật khẩu tạm và gửi cho người đó. Lần đầu đăng nhập app sẽ yêu cầu đổi mật khẩu.</div>' : ''}</div>
      <div class="card"><h3>Giá list / box</h3><div class="tw"><table class="t"><thead><tr><th class="l">SKU</th><th class="l">Brand</th><th>Giá/box (VND)</th></tr></thead><tbody id="pr">${D.prices.map(p => prRow(p)).join('')}</tbody></table></div>
      <div class="bar" style="margin-top:8px"><button class="btn" id="pr-add">+ Thêm SKU</button><span class="grow"></span><button class="btn pri" id="pr-save">Lưu</button></div><div class="sub">Tên SKU phải trùng tên trong raw data (vd thêm Firialta khi có hàng).</div></div></div>`;
    $('#mb-add').onclick = () => $('#mb').insertAdjacentHTML('beforeend', memRow({email: '', rep_name: '', role: 'MR'}));
    $('#mb-fill').onclick = () => { const have = new Set($$('#mb tr').map(r => norm($('[data-c=rep]', r).value))); [...new Set(D.mapping.map(m => m.rep_name))].filter(r => !have.has(r)).forEach(r => $('#mb').insertAdjacentHTML('beforeend', memRow({email: '', rep_name: r, role: 'MR'}))); };
    $('#mb-parse').onclick = () => { const lines = $('#mb-paste').value.split(/\r?\n/).map(l => l.split(/\t|,|;/).map(norm)).filter(x => x[0] && x[0].includes('@')); const have = new Map($$('#mb tr').map(r => [lc($('[data-c=email]', r).value), r])); let n = 0;
      for (const [email, rep, role] of lines){ const rl = ['MR', 'RFFM', 'ADMIN'].includes((role || '').toUpperCase()) ? role.toUpperCase() : 'MR'; const ex = have.get(lc(email)); if (ex){ $('[data-c=rep]', ex).value = rep || $('[data-c=rep]', ex).value; $('[data-c=role]', ex).value = rl; } else $('#mb').insertAdjacentHTML('beforeend', memRow({email, rep_name: rep || '', role: rl})); n++; }
      const byRep = new Map($$('#mb tr').filter(r => !$('[data-c=email]', r).value).map(r => [lc($('[data-c=rep]', r).value), r]));
      $$('#mb tr').filter(r => $('[data-c=email]', r).value).forEach(r => { const blank = byRep.get(lc($('[data-c=rep]', r).value)); if (blank && blank !== r) blank.remove(); });
      toast(`Đã đưa ${n} dòng vào bảng, bấm Lưu để ghi.`); };
    $('#mb').addEventListener('click', e => { if (e.target.dataset.rm !== undefined) e.target.closest('tr').remove(); });
    $('#mb-save').onclick = async () => { const list = $$('#mb tr').map(r => ({email: lc($('[data-c=email]', r).value), rep_name: norm($('[data-c=rep]', r).value), role: $('[data-c=role]', r).value})).filter(m => m.email && m.rep_name); if (!list.some(m => m.role === 'ADMIN')) return toast('Cần ít nhất 1 ADMIN'); try { await STORE.saveMembers(list); toast('Đã lưu thành viên'); await reload(); } catch(e){ toast('Lỗi: ' + e.message); } };
    $('#pr-add').onclick = () => $('#pr').insertAdjacentHTML('beforeend', prRow({sku: '', brand: '', price: ''}));
    $('#pr-save').onclick = async () => { const list = $$('#pr tr').map(r => ({sku: norm($('[data-c=sku]', r).value), brand: norm($('[data-c=brand]', r).value).toUpperCase(), price: num($('[data-c=price]', r).value)})).filter(p => p.sku && p.price); try { await STORE.savePrices(list); toast('Đã lưu giá'); await reload(); } catch(e){ toast('Lỗi: ' + e.message); } };
  }
}
const memRow = m => `<tr><td class="l"><input data-c="email" value="${esc(m.email)}" placeholder="email" style="width:190px"></td><td class="l"><input data-c="rep" value="${esc(m.rep_name)}" style="width:170px"></td><td class="l"><select data-c="role">${['MR', 'RFFM', 'ADMIN'].map(r => `<option ${r === m.role ? 'selected' : ''}>${r}</option>`).join('')}</select></td><td><button class="btn sm danger" data-rm>✕</button></td></tr>`;
const prRow = p => `<tr><td class="l"><input data-c="sku" value="${esc(p.sku)}" style="width:200px"></td><td class="l"><input data-c="brand" value="${esc(p.brand)}" style="width:90px"></td><td><input data-c="price" value="${p.price}" style="width:110px;text-align:right"></td></tr>`;

boot().catch(e => { $('#app').innerHTML = `<div class="login"><h1>Lỗi khởi động</h1><div class="msg err">${esc(e.message || e)}</div></div>`; });
</script>
</body>
</html>
