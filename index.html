<style>

/* charts */
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}

.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:-4px 0 10px;flex-wrap:wrap}

.cols .c span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink2);white-space:nowrap;padding-bottom:2px}
.cols .tline{position:absolute;left:4px;right:4px;height:2px;background:var(--ink);border-radius:1px}
.xl{display:flex;gap:14px;padding:6px 4px 0}
.xl div{flex:1;text-align:center;font-size:12px;color:var(--ink2)}
#tip{position:fixed;pointer-events:none;background:#0b0b0b;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;z-index:99;max-width:260px;display:none;white-space:pre-line}
/* login */
.login{max-width:420px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
.login h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
.login .f{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.login input,.login select{border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.msg{font-size:13px;margin-top:10px}
.msg.err{color:var(--critical)}
/* admin */
.adm{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.drop{border:1.5px dashed #c9ccd3;border-radius:10px;padding:12px;text-align:center;color:var(--ink2);font-size:13px;background:#fafbfc}
.drop input{margin-top:8px}
.log{font-size:12.5px;color:var(--ink2);margin-top:8px;white-space:pre-line}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.chip.ok{background:#e4f5e4;color:#0a6e0a}
.chip.no{background:#fde9e9;color:#b32d2d}
.chip.lk{background:#eceef2;color:#555}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0b0b0b;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:100}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.35);display:flex;align-items:center;justify-content:center;z-index:90}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:440px;width:92%}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media (max-width:760px){
  main{padding:12px 10px 60px}
  .top{padding:8px 12px;gap:8px}
  .tabs{order:3;width:100%;margin:0}
  .tab{flex:1}
  .kpi .v{font-size:18px}

<script>
'use strict';
/* =========================================================
   1. TIỆN ÍCH
   ========================================================= */
const CFG = window.FC_CONFIG || {};
const MODE = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) ? 'cloud' : 'demo';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(String(v ?? '').toString().replace(/,/g, '')); return isFinite(n) ? n : 0; };
const nf0 = new Intl.NumberFormat('vi-VN', {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat('vi-VN', {maximumFractionDigits: 1, minimumFractionDigits: 1});
const nf2 = new Intl.NumberFormat('vi-VN', {maximumFractionDigits: 2, minimumFractionDigits: 2});
const tr = v => { if (!v) return '–'; const m = v / 1e6; return Math.abs(m) < 100 ? nf1.format(m) : nf0.format(m); };
const big = v => !v ? '0' : (Math.abs(v) >= 1e9 ? nf2.format(v / 1e9) + ' tỷ' : nf0.format(v / 1e6) + ' tr');
const pct = v => (v === null || v === undefined || !isFinite(v)) ? '–' : nf0.format(v * 100) + '%';
const ratio = (a, b) => b ? a / b : null;
const growth = (a, b) => b ? a / b - 1 : null;
const pkey = (y, q) => `${y}Q${q}`;
const qlabel = (y, q) => `Q${q}'${String(y).slice(-2)}`;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const norm = s => String(s ?? '').trim();
const lc = s => norm(s).toLowerCase();
const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleString('vi-VN', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'}); };
function achClass(a){ if (a === null) return ''; return a >= 1 ? 'good' : (a < 0.8 ? 'bad' : 'mid'); }
function achHtml(a){ if (a === null) return '<span class="muted">–</span>'; const c = achClass(a); const ic = c === 'good' ? '▲' : (c === 'bad' ? '▼' : '●'); return `<span class="st ${c}">${ic} ${pct(a)}</span>`; }
function grHtml(g){ if (g === null) return '<span class="muted">–</span>'; return `<span class="${g < 0 ? 'st bad' : ''}">${g > 0 ? '+' : ''}${pct(g)}</span>`; }
function toast(msg, ms = 2600){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function confirmBox(msg){ return new Promise(res => { const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="modal"><div>${msg}</div><div class="acts"><button class="btn" data-a="0">Hủy</button><button class="btn pri" data-a="1">Đồng ý</button></div></div>`; document.body.appendChild(bg); bg.addEventListener('click', e => { const a = e.target.dataset.a; if (a !== undefined){ bg.remove(); res(a === '1'); } }); }); }
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
function periodsOf(y, q){ const out = []; for (let k = 4; k >= 0; k--){ const idx = y * 4 + (q - 1) - k; out.push({y: Math.floor(idx / 4), q: idx % 4 + 1}); } return out.map(p => ({...p, label: qlabel(p.y, p.q)})); }
const brandOf = sku => norm(sku).split(' ')[0].toUpperCase();
const isAssigned = (rep, kws) => { const r = lc(rep); return r && !kws.some(k => k && r.includes(lc(k))); };

/* tooltip */
const TIP = $('#tip');
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (!t){ TIP.style.display = 'none'; return; } TIP.textContent = t.dataset.tip; TIP.style.display = 'block'; });
document.addEventListener('mousemove', e => { if (TIP.style.display === 'block'){ const x = Math.min(e.clientX + 14, innerWidth - 270); TIP.style.left = x + 'px'; TIP.style.top = (e.clientY + 14) + 'px'; } });

/* =========================================================
   2. DỮ LIỆU DEMO (giả lập — không phải số thật)
   ========================================================= */
function seedDemo(){
  let s = 20261110; const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const ho = ['Nguyen','Tran','Le','Pham','Hoang','Vo','Dang','Bui','Do','Ngo'];
  const dem = ['Thi','Van','Minh','Thanh','Ngoc','Quoc','Hoang','Thu'];
  const ten = ['An','Binh','Chi','Dung','Giang','Ha','Khang','Linh','My','Nam','Phuong','Quan','Son','Tam','Uyen','Vy','Yen','Bao','Hieu','Trang'];
  const reps = ten.map((t, i) => `${ho[i % ho.length]} ${dem[i % dem.length]} ${t}`);
  const members = reps.map((r, i) => ({email: `mr${String(i + 1).padStart(2, '0')}@demo.vn`, rep_name: r, role: 'MR'}));
  members.unshift({email: 'rffm@demo.vn', rep_name: 'RFFM Demo', role: 'RFFM'});
  members.unshift({email: 'admin@demo.vn', rep_name: 'Admin (bạn)', role: 'ADMIN'});
  const prices = [
    {sku: "XARELTO TAB 20MG 14'S", brand: 'XARELTO', price: 750000},
    {sku: "XARELTO TAB 15MG 14'S", brand: 'XARELTO', price: 750000},
    {sku: "XARELTO TAB 10MG 10'S", brand: 'XARELTO', price: 550000},
    {sku: 'XARELTO 2.5mg 14 TABL', brand: 'XARELTO', price: 360000},
    {sku: "ADALAT LA TAB 30MG 30'S", brand: 'ADALAT', price: 270000}
  ];
  const kinds = ['Benh Vien Da Khoa','Benh Vien Quan','PKDK','Nha Thuoc BV','Benh Vien Tim','PK BS'];
  const places = ['Binh An','Hoa Hung','Phu Tho','Tan Phu','Gia Hoa','Song Than','Minh Tri','An Lac','Thien Phuc','Hong Duc','Nam Viet','Sai Thanh'];
  const mapping = []; const sales = []; const targets = []; const fc = {}; let id = 1;
  const settings = {year: 2026, quarter: 4, deadline: '2026-11-20', locked: false, team_filter: 'CVRM', exclude_keywords: 'Vacant,New MR,Uncovered'};
  const per = periodsOf(2026, 4); const hist = [{y:2025,q:1},{y:2025,q:2},{y:2025,q:3}, ...per];
  for (let a = 0; a < 96; a++){
    const code = String(30190500 + a * 7);
    const name = `${pick(kinds)} ${pick(places)} ${a + 1}`;
    const rep = reps[a % reps.length];
    const ch = pick(['Tender','Tender','Self-pay','Other']);
    const brands = rnd() < .55 ? ['ADALAT','XARELTO'] : (rnd() < .7 ? ['XARELTO'] : ['ADALAT']);
    for (const p of prices){
      if (!brands.includes(p.brand)) continue;
      const base = (p.brand === 'ADALAT' ? 40 : 30) * (0.3 + rnd() * 2.2) * (a % 9 === 0 ? 6 : 1);
      const mid = id++;
      mapping.push({id: mid, rep_name: rep, cust_code: code, cust_name: name, brand: p.brand, sku: p.sku, ratio: 1, channel: ch});
      let lvl = base; let last2 = [];
      hist.forEach((h, i) => {
        lvl = Math.max(0, lvl * (0.85 + rnd() * 0.35));
        let box = Math.round(lvl * (rnd() < .12 ? 0 : 1));
        if (i === hist.length - 1) box = Math.round(box * 0.38);
        if (box) sales.push({cust_code: code, sku: p.sku, year: h.y, quarter: h.q, value: box * p.price});
        if (i >= hist.length - 3 && i < hist.length - 1) last2.push(box);
      });
      const tg = Math.round((last2.reduce((x, y) => x + y, 0) / 2) * (1.05 + rnd() * .15));
      if (tg) targets.push({cust_code: code, sku: p.sku, value: tg * p.price});
      if (reps.indexOf(rep) % 3 !== 2){
        const m = Math.max(0, Math.round(tg / 3 * (0.75 + rnd() * .4)));
        fc[mid] = {m1: m, m2: Math.round(m * (0.9 + rnd() * .2)), m3: Math.round(m * (0.9 + rnd() * .3)), note: rnd() < .08 ? 'Chờ kết quả thầu mới' : '', updated_at: new Date(Date.now() - rnd() * 4e8).toISOString(), updated_by: ''};
      }
    }
  }
  const seen = [{cust_code: '30199991', sku: "XARELTO TAB 15MG 14'S", cust_name: 'PK BS Mau Moi', rep_name: reps[3], value: 46400000},
                {cust_code: '30199991', sku: "ADALAT LA TAB 30MG 30'S", cust_name: 'PK BS Mau Moi', rep_name: reps[3], value: 8100000}];
  sales.push({cust_code: '30199991', sku: "XARELTO TAB 15MG 14'S", year: 2026, quarter: 3, value: 46400000});
  sales.push({cust_code: '30199991', sku: "ADALAT LA TAB 30MG 30'S", year: 2026, quarter: 3, value: 8100000});
  const subs = {}; reps.forEach((r, i) => { if (i % 3 === 0) subs[r] = {submitted_at: new Date(Date.now() - i * 3.6e6).toISOString(), submitted_by: ''}; });
  return {settings, members, prices, mapping, sales, seen, targets: {[pkey(2026, 4)]: targets}, fc: {[pkey(2026, 4)]: fc}, subs: {[pkey(2026, 4)]: subs}, nextId: id};
}

/* =========================================================
   3. LỚP LƯU TRỮ — Demo (trình duyệt) / Cloud (Supabase)
   ========================================================= */
const LS_KEY = 'fcapp_demo_v1';
class DemoStore {
  constructor(){ this.db = lsGet(LS_KEY) || seedDemo(); this.persist(); this.user = lsGet(LS_KEY + '_user'); }
  persist(){ lsSet(LS_KEY, this.db); }
  async currentEmail(){ return this.user; }
  async signInDemo(email){ this.user = email; lsSet(LS_KEY + '_user', email); }
  async signOut(){ this.user = null; lsSet(LS_KEY + '_user', null); }
  async loadAll(){
    const d = this.db; const pk = pkey(d.settings.year, d.settings.quarter);
    return {settings: {...d.settings}, members: d.members, prices: d.prices, mapping: d.mapping, sales: d.sales, seen: d.seen,
      targets: d.targets[pk] || [], fc: d.fc[pk] || {}, subs: d.subs[pk] || {}};
  }
  async saveFC(period, mid, rec){ (this.db.fc[period] ||= {})[mid] = {...rec, updated_at: new Date().toISOString(), updated_by: this.user}; this.persist(); }
  async upsertFC(period, list){ const t = (this.db.fc[period] ||= {}); list.forEach(r => t[r.mapping_id] = {m1: r.m1, m2: r.m2, m3: r.m3, note: r.note, updated_at: new Date().toISOString(), updated_by: this.user}); this.persist(); }
  async submit(period, rep){ (this.db.subs[period] ||= {})[rep] = {submitted_at: new Date().toISOString(), submitted_by: this.user}; this.persist(); }
  async saveSettings(s){ this.db.settings = {...this.db.settings, ...s}; this.persist(); }
  async replaceSales(rows, seen){ this.db.sales = rows; this.db.seen = seen; this.persist(); }
  async replaceTargets(period, rows){ this.db.targets[period] = rows; this.persist(); }
  async savePrices(list){ this.db.prices = list; this.persist(); }
  async saveMembers(list){ this.db.members = list; this.persist(); }
  async upsertMapping(rows, deleteMissing){
    const key = r => `${r.rep_name}|${r.cust_code}|${r.sku}`; const cur = new Map(this.db.mapping.map(r => [key(r), r])); const keep = new Set();
    for (const r of rows){ const k = key(r); keep.add(k); if (cur.has(k)) Object.assign(cur.get(k), {cust_name: r.cust_name, brand: r.brand, ratio: r.ratio, channel: r.channel}); else { const n = {...r, id: this.db.nextId++}; this.db.mapping.push(n); cur.set(k, n); } }
    if (deleteMissing) this.db.mapping = this.db.mapping.filter(r => keep.has(key(r)));
    this.persist(); return this.db.mapping;
  }
  async updateMappingRow(id, patch){ const r = this.db.mapping.find(x => x.id === id); Object.assign(r, patch); this.persist(); }
  async deleteMappingRows(ids){ const s = new Set(ids); this.db.mapping = this.db.mapping.filter(r => !s.has(r.id)); this.persist(); }
  reset(){ this.db = seedDemo(); this.persist(); }
}

class CloudStore {
  constructor(sb){ this.sb = sb; }
  async currentEmail(){ const {data} = await this.sb.auth.getSession(); return data.session?.user?.email?.toLowerCase() || null; }
  async signInPassword(email, pw){ const {error} = await this.sb.auth.signInWithPassword({email, password: pw}); if (error) throw error; }
  async sendLink(email){ const {error} = await this.sb.auth.signInWithOtp({email, options: {shouldCreateUser: false, emailRedirectTo: location.href.split('#')[0]}}); if (error) throw error; }
  async signOut(){ await this.sb.auth.signOut(); }
  async getUser(){ const {data} = await this.sb.auth.getUser(); return data.user; }
  async setPassword(pw){ const {error} = await this.sb.auth.updateUser({password: pw, data: {pw_changed: true}}); if (error) throw error; }
  async all(table, sel = '*', f){ const out = []; for (let from = 0; ; from += 1000){ let q = this.sb.from(table).select(sel).range(from, from + 999); if (f) q = f(q); const {data, error} = await q; if (error) throw error; out.push(...data); if (data.length < 1000) break; } return out; }
  async loadAll(){
    const st = await this.all('settings'); const settings = st[0] || {year: new Date().getFullYear(), quarter: Math.floor(new Date().getMonth() / 3) + 1, locked: false, team_filter: 'CVRM', exclude_keywords: 'Vacant,New MR,Uncovered'};
    const pk = pkey(settings.year, settings.quarter);
    const [members, prices, mapping, sales, seen, targets, fcRows, subRows] = await Promise.all([
      this.all('team_members'), this.all('prices'), this.all('mapping', '*', q => q.order('id')), this.all('sales_agg'), this.all('accounts_seen'),
      this.all('targets', '*', q => q.eq('period', pk)), this.all('fc_entries', '*', q => q.eq('period', pk)), this.all('submissions', '*', q => q.eq('period', pk))]);
    const fc = {}; fcRows.forEach(r => fc[r.mapping_id] = r); const subs = {}; subRows.forEach(r => subs[r.rep_name] = r);
    return {settings, members, prices, mapping, sales, seen, targets, fc, subs};
  }
  async chunked(table, rows, opts){ for (let i = 0; i < rows.length; i += 500){ const {error} = await this.sb.from(table).upsert(rows.slice(i, i + 500), opts); if (error) throw error; } }
  async saveFC(period, mid, rec){ const {error} = await this.sb.from('fc_entries').upsert({period, mapping_id: mid, m1: rec.m1, m2: rec.m2, m3: rec.m3, note: rec.note, updated_at: new Date().toISOString()}); if (error) throw error; }
  async upsertFC(period, list){ await this.chunked('fc_entries', list.map(r => ({period, ...r, updated_at: new Date().toISOString()}))); }
  async submit(period, rep){ const {error} = await this.sb.from('submissions').upsert({period, rep_name: rep, submitted_at: new Date().toISOString()}); if (error) throw error; }
  async saveSettings(s){ const {error} = await this.sb.from('settings').upsert({id: 1, ...s}); if (error) throw error; }
  async wipe(table, col){ const {error} = await this.sb.from(table).delete().not(col, 'is', null); if (error) throw error; }
  async replaceSales(rows, seen){ await this.wipe('sales_agg', 'cust_code'); await this.chunked('sales_agg', rows); await this.wipe('accounts_seen', 'cust_code'); await this.chunked('accounts_seen', seen); }
  async replaceTargets(period, rows){ const {error} = await this.sb.from('targets').delete().eq('period', period); if (error) throw error; await this.chunked('targets', rows.map(r => ({period, ...r}))); }
  async savePrices(list){ await this.wipe('prices', 'sku'); await this.chunked('prices', list); }
  async saveMembers(list){ await this.chunked('team_members', list.map(m => ({...m, email: lc(m.email)}))); const keep = new Set(list.map(m => lc(m.email))); const cur = await this.all('team_members'); const del = cur.filter(m => !keep.has(m.email)).map(m => m.email); if (del.length){ const {error} = await this.sb.from('team_members').delete().in('email', del); if (error) throw error; } }
  async upsertMapping(rows, deleteMissing){
    await this.chunked('mapping', rows.map(r => ({rep_name: r.rep_name, cust_code: r.cust_code, cust_name: r.cust_name, brand: r.brand, sku: r.sku, ratio: r.ratio, channel: r.channel})), {onConflict: 'rep_name,cust_code,sku'});
    let all = await this.all('mapping', '*', q => q.order('id'));
    if (deleteMissing){ const keep = new Set(rows.map(r => `${r.rep_name}|${r.cust_code}|${r.sku}`)); const del = all.filter(r => !keep.has(`${r.rep_name}|${r.cust_code}|${r.sku}`)).map(r => r.id); for (let i = 0; i < del.length; i += 200){ const {error} = await this.sb.from('mapping').delete().in('id', del.slice(i, i + 200)); if (error) throw error; } all = all.filter(r => !del.includes(r.id)); }
    return all;
  }
  async updateMappingRow(id, patch){ const {error} = await this.sb.from('mapping').update(patch).eq('id', id); if (error) throw error; }
  async deleteMappingRows(ids){ const {error} = await this.sb.from('mapping').delete().in('id', ids); if (error) throw error; }
}

let STORE, D, ME, VIEW = {tab: 'fc', fcRep: null, fcBrand: '', fcSearch: '', fcOnly: false, dRep: '', dBrand: '', dCh: '', admTab: 'import'};
let P = [], PK = '', ROWS = [];
function build(){
  const s = D.settings; P = periodsOf(s.year, s.quarter); PK = pkey(s.year, s.quarter);
  const sIdx = new Map(); for (const r of D.sales){ const k = `${r.cust_code}|${r.sku}|${r.year}|${r.quarter}`; sIdx.set(k, (sIdx.get(k) || 0) + num(r.value)); }
  const tIdx = new Map(); for (const r of D.targets){ const k = `${r.cust_code}|${r.sku}`; tIdx.set(k, (tIdx.get(k) || 0) + num(r.value)); }
  const price = new Map(D.prices.map(p => [p.sku, num(p.price)]));
  const ratioSum = new Map(); for (const m of D.mapping){ const k = `${m.cust_code}|${m.sku}`; ratioSum.set(k, (ratioSum.get(k) || 0) + num(m.ratio)); }
  ROWS = D.mapping.map(m => {
    const rt = num(m.ratio); const f = D.fc[m.id] || {};
    const act = P.map(p => (sIdx.get(`${m.cust_code}|${m.sku}|${p.y}|${p.q}`) || 0) * rt);
    const box = num(f.m1) + num(f.m2) + num(f.m3); const pr = price.get(m.sku);
    const rs = ratioSum.get(`${m.cust_code}|${m.sku}`);
    return {...m, act, tgt: (tIdx.get(`${m.cust_code}|${m.sku}`) || 0) * rt, f, box, fcv: box * (pr || 0),
      filled: f.m1 != null && f.m1 !== '' || f.m2 != null && f.m2 !== '' || f.m3 != null && f.m3 !== '',
      warn: Math.abs(rs - 1) > 0.001 ? 'Ratio≠100%' : (pr === undefined ? 'SKU thiếu giá' : '')};
  });
}
function agg(rows){ const a = {act: [0,0,0,0,0], tgt: 0, fcv: 0, box: 0, n: rows.length, filled: 0}; for (const r of rows){ r.act.forEach((v, i) => a.act[i] += v); a.tgt += r.tgt; a.fcv += r.fcv; a.box += r.box; if (r.filled) a.filled++; } const has = a.filled > 0; a.ach = has ? ratio(a.fcv, a.tgt) : null; a.achQ = ratio(a.act[4], a.tgt); a.gLy = has ? growth(a.fcv, a.act[0]) : null; a.gQ = has ? growth(a.fcv, a.act[3]) : null; return a; }
const isAdmin = () => ME?.role === 'ADMIN';
const canSeeAll = () => ME && (ME.role === 'ADMIN' || ME.role === 'RFFM');
const repList = () => [...new Set([...D.members.filter(m => m.role === 'MR').map(m => m.rep_name), ...D.mapping.map(m => m.rep_name)])].sort();
const canEdit = rep => isAdmin() || (ME.role === 'MR' && ME.rep_name === rep && !D.settings.locked);

function readWorkbook(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = e => { try { res(XLSX.read(new Uint8Array(e.target.result), {type: 'array', cellDates: false})); } catch(err){ rej(err); } }; fr.onerror = rej; fr.readAsArrayBuffer(file); }); }

function findHeader(rows, mustHave){ for (let i = 0; i < Math.min(rows.length, 30); i++){ const r = (rows[i] || []).map(lc); if (mustHave.every(h => r.includes(lc(h)))) return i; } return -1; }

async function importSales(file, log){

    hi = findHeader(rows, ['Cus. Code', 'Product Name', 'Final Target']); if (hi >= 0){ const h = rows[hi]; c = {code: colIdx(h, ['Cus. Code']), sku: colIdx(h, ['Product Name']), v: colIdx(h, ['Final Target'])}; break; } }
  if (hi < 0 || c.v < 0) throw new Error('Không thấy cột Cust Code / SKU / Target');
  const m = new Map(); for (let i = hi + 1; i < rows.length; i++){ const r = rows[i]; if (!r[c.code] || !r[c.sku]) continue; const k = `${norm(r[c.code])}|${norm(r[c.sku])}`; m.set(k, (m.get(k) || 0) + num(r[c.v])); }
  const list = [...m].map(([k, value]) => { const [cust_code, sku] = k.split('|'); return {cust_code, sku, value}; });
  await STORE.replaceTargets(PK, list); log(`Target ${P[4].label}: ${list.length} dòng, tổng ${big(list.reduce((s, x) => s + x.value, 0))}.`);
}
function exportExcel(){
  const m = (D.settings.quarter - 1) * 3; const hdr = ['REP Name', 'Cust Code', 'Cust Name', 'Brand', 'SKU', 'Sales ratio', 'Kênh', ...P.slice(0, 4).map(p => 'Act. ' + p.label), 'Act. QTD ' + P[4].label, 'Target ' + P[4].label, `FC ${MONTHS[m]} (box)`, `FC ${MONTHS[m + 1]} (box)`, `FC ${MONTHS[m + 2]} (box)`, 'FC quý (box)', 'FC quý (value)', '%Ach FC', '%Gr vs LYSP', '%Gr vs Q-1', 'Ghi chú', 'Cập nhật lúc'];
  const data = ROWS.map(r => [r.rep_name, r.cust_code, r.cust_name, r.brand, r.sku, num(r.ratio), r.channel || '', ...r.act, r.tgt, r.f.m1 ?? null, r.f.m2 ?? null, r.f.m3 ?? null, r.box, r.fcv, ratio(r.fcv, r.tgt), growth(r.fcv, r.act[0]), growth(r.fcv, r.act[3]), r.f.note || '', r.f.updated_at ? new Date(r.f.updated_at) : null]);
  const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet([hdr, ...data]); ws['!autofilter'] = {ref: `A1:${XLSX.utils.encode_col(hdr.length - 1)}${data.length + 1}`}; XLSX.utils.book_append_sheet(wb, ws, 'FC Input');
  const reps = repList(); const sum = [['MR', 'Target', 'FC', '%Ach FC', 'QTD', 'Đã nộp lúc'], ...reps.map(rep => { const a = agg(ROWS.filter(r => r.rep_name === rep)); return [rep, a.tgt, a.fcv, a.ach, a.act[4], D.subs[rep] ? new Date(D.subs[rep].submitted_at) : 'Chưa nộp']; })];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), 'Tổng hợp MR');
  const fname = `FC_${P[4].label.replace("'", '')}_${new Date().toISOString().slice(0, 10)}.xlsx`;
  try { XLSX.writeFile(wb, fname); toast('Đã xuất ' + fname); } catch(e){ toast('Trình duyệt chặn tải file (bản xem trước). Trên GitHub Pages sẽ tải bình thường.'); }
}
function missingAccounts(){ const keys = new Set(D.mapping.map(m => `${m.cust_code}|${m.sku}`)); return D.seen.filter(s => !keys.has(`${s.cust_code}|${s.sku}`)).sort((a, b) => b.value - a.value); }

function viewAdmin(){
  const v = $('#view'); const s = D.settings; const miss = missingAccounts(); const warn = ROWS.filter(r => r.warn);
  const t = VIEW.admTab; const subtabs = [['import', 'Kỳ & nạp dữ liệu'], ['missing', `Account thiếu (${new Set(miss.map(x => x.cust_code)).size})`], ['mapping', `Phân bổ account${warn.length ? ` (${warn.length} cảnh báo)` : ''}`], ['members', 'Thành viên & giá']];
  v.innerHTML = `<div class="bar">${subtabs.map(([k, l]) => `<button class="btn ${t === k ? 'pri' : ''}" data-at="${k}">${l}</button>`).join('')}<span class="grow"></span><button class="btn" id="exp">⬇ Xuất Excel</button>${MODE === 'demo' ? '<button class="btn danger" id="rst">Reset demo</button>' : ''}</div><div id="adm"></div>`;
  $$('[data-at]').forEach(b => b.onclick = () => { VIEW.admTab = b.dataset.at; viewAdmin(); });
  $('#exp').onclick = exportExcel;
  $('#rst') && ($('#rst').onclick = async () => { if (await confirmBox('Xóa toàn bộ dữ liệu demo và tạo lại?')){ STORE.reset(); await reload(); } });
  const A = $('#adm');
  if (t === 'import'){
    A.innerHTML = `<div class="adm">
      <div class="card"><h3>Kỳ FC</h3><div class="bar"><label>Năm</label><input type="number" id="s-y" value="${s.year}" style="width:90px"><label>Quý</label><select id="s-q">${[1, 2, 3, 4].map(q => `<option ${q === s.quarter ? 'selected' : ''}>${q}</option>`).join('')}</select></div>
        <div class="bar"><label>Hạn nộp</label><input type="date" id="s-d" value="${s.deadline || ''}"><label><input type="checkbox" id="s-l" ${s.locked ? 'checked' : ''}> Khóa nhập (MR chỉ xem)</label></div>
        <div class="bar"><label>Team trong raw data (REP Group)</label><input type="text" id="s-t" value="${esc(s.team_filter || 'CVRM')}" style="width:90px"></div>
        <div class="bar"><label>MR chưa gán nếu tên chứa</label><input type="text" id="s-x" value="${esc(s.exclude_keywords || '')}" style="min-width:220px"></div>
        <button class="btn pri" id="s-save">Lưu</button><div class="sub" style="margin-top:8px">Đổi sang quý mới: FC và target bắt đầu trống cho kỳ mới, dữ liệu kỳ cũ vẫn giữ.</div></div>
      <div class="card"><h3>1. Danh sách account, giá & FC (file Excel FC)</h3><div class="drop">Sheet FC Input (file v2) hoặc FC Sale (file cũ). Có sheet Setup thì lấy luôn bảng giá.<br><input type="file" id="u-f" accept=".xlsx,.xls,.xlsm"></div>
        <div class="bar" style="margin-top:8px"><label><input type="checkbox" id="u-fc" checked> Nạp luôn số FC box + ghi chú vào kỳ ${P[4].label}</label></div>
        <div class="bar"><label><input type="checkbox" id="u-del"> Xóa dòng không có trong file (xóa cả FC của dòng đó)</label></div><div class="log" id="l-f">Đang có ${D.mapping.length} dòng account × SKU.</div></div>
      <div class="card"><h3>2. Raw sales (export Power BI)</h3><div class="drop">File .xlsx export. Tự dò cột theo tên, bỏ dòng Total.<br><input type="file" id="u-s" accept=".xlsx,.xls,.xlsm"></div><div class="log" id="l-s">${D.sales.length ? `Đang có ${nf0.format(D.sales.length)} dòng tổng hợp.` : 'Chưa có dữ liệu.'}</div></div>
      <div class="card"><h3>3. Target ${P[4].label}</h3><div class="drop">Sheet Target (file v2) hoặc Target by account (file cũ).<br><input type="file" id="u-t" accept=".xlsx,.xls,.xlsm"></div><div class="log" id="l-t">Đang có ${D.targets.length} dòng, tổng ${big(D.targets.reduce((a, x) => a + num(x.value), 0))}.</div></div>
    </div>`;
    $('#s-save').onclick = async () => { const ns = {year: num($('#s-y').value), quarter: num($('#s-q').value), deadline: $('#s-d').value || null, locked: $('#s-l').checked, team_filter: $('#s-t').value.trim(), exclude_keywords: $('#s-x').value.trim()}; if (ns.quarter < 1 || ns.quarter > 4 || ns.year < 2020) return toast('Năm/quý không hợp lệ'); try { await STORE.saveSettings(ns); toast('Đã lưu kỳ FC'); await reload(); } catch(e){ toast('Lỗi: ' + e.message); } };
    const hook = (id, lid, fn) => { $(id).onchange = async e => { const f = e.target.files[0]; if (!f) return; const L = $(lid); L.textContent = 'Đang xử lý…'; try { await fn(f, m => L.textContent = m); D = await STORE.loadAll(); build(); L.textContent += '\n✓ Xong.'; } catch(err){ L.textContent = '✗ ' + err.message; } e.target.value = ''; }; };
    hook('#u-s', '#l-s', importSales); hook('#u-f', '#l-f', (f, log) => importFCTemplate(f, $('#u-fc').checked, $('#u-del').checked, log)); hook('#u-t', '#l-t', importTargets);
  }
  if (t === 'missing'){
    A.innerHTML = `<div class="card"><h3>Account có sales, đã gán MR nhưng chưa có trong danh sách FC</h3><div class="sub" style="margin-bottom:10px">Lấy từ raw sales gần nhất (team ${esc(s.team_filter)}). Bấm Thêm để tạo dòng FC cho MR, đủ các SKU của brand đó.</div>
      ${miss.length ? `<div class="tw"><table class="t"><thead><tr><th class="l"><input type="checkbox" id="m-all" checked></th><th class="l">Account</th><th class="l">Mã</th><th class="l">SKU</th><th class="l">MR trong data</th><th>Doanh số (tr)</th></tr></thead><tbody>
        ${miss.map((x, i) => `<tr><td class="l"><input type="checkbox" class="m-ck" data-i="${i}" checked></td><td class="l">${esc(x.cust_name)}</td><td class="l">${esc(x.cust_code)}</td><td class="l">${esc(x.sku)}</td><td class="l">${esc(x.rep_name)}</td><td>${tr(x.value)}</td></tr>`).join('')}</tbody></table></div>
        <div class="bar" style="margin-top:10px"><button class="btn pri" id="m-add">Thêm các dòng đã chọn</button></div>` : '<div class="chip ok">✓ Không có account nào bị thiếu</div>'}</div>`;
    $('#m-all') && ($('#m-all').onchange = e => $$('.m-ck').forEach(c => c.checked = e.target.checked));
    $('#m-add') && ($('#m-add').onclick = async () => {
      const pick = $$('.m-ck').filter(c => c.checked).map(c => miss[+c.dataset.i]); const add = new Map();
      for (const x of pick){ const b = brandOf(x.sku); for (const p of D.prices.filter(p => p.brand === b)){ const k = `${x.rep_name}|${x.cust_code}|${p.sku}`; if (!D.mapping.some(m => `${m.rep_name}|${m.cust_code}|${m.sku}` === k)) add.set(k, {rep_name: x.rep_name, cust_code: x.cust_code, cust_name: x.cust_name, brand: b, sku: p.sku, ratio: 1, channel: null}); } }
      try { await STORE.upsertMapping([...D.mapping, ...add.values()], false); toast(`Đã thêm ${add.size} dòng`); await reload(); } catch(e){ toast('Lỗi: ' + e.message); }
    });
  }
  if (t === 'mapping'){
    const q = VIEW.mapQ || ''; const reps = repList(); const list = ROWS.filter(r => (!VIEW.mapWarn || r.warn) && (!q || lc(`${r.cust_name} ${r.cust_code} ${r.rep_name} ${r.sku}`).includes(lc(q))));
    A.innerHTML = `<div class="card"><div class="bar"><input type="search" id="mp-q" placeholder="Tìm account / MR / SKU" value="${esc(q)}"><label><input type="checkbox" id="mp-w" ${VIEW.mapWarn ? 'checked' : ''}> Chỉ dòng cảnh báo</label><span class="grow"></span><span class="sub">${list.length} dòng · sửa MR / ratio / kênh là lưu ngay</span></div>
      <div class="tw"><table class="t"><thead><tr><th class="l">MR</th><th class="l">Account</th><th class="l">Mã</th><th class="l">SKU</th><th>Ratio</th><th class="l">Kênh</th><th class="l">Cảnh báo</th><th></th></tr></thead><tbody>
      ${list.slice(0, 400).map(r => `<tr><td class="l"><select data-mid="${r.id}" data-k="rep_name">${reps.map(x => `<option ${x === r.rep_name ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></td><td class="l">${esc(r.cust_name)}</td><td class="l">${esc(r.cust_code)}</td><td class="l">${esc(r.sku)}</td>
        <td><input data-mid="${r.id}" data-k="ratio" value="${num(r.ratio)}" style="width:60px;text-align:right"></td><td class="l"><select data-mid="${r.id}" data-k="channel">${['', 'Tender', 'Self-pay', 'Other'].map(x => `<option ${x === (r.channel || '') ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
        <td class="l"><span class="warn">${r.warn}</span></td><td><button class="btn sm danger" data-del="${r.id}">Xóa</button></td></tr>`).join('')}</tbody></table></div>${list.length > 400 ? '<div class="sub">Hiện 400 dòng đầu, dùng ô tìm để lọc.</div>' : ''}</div>`;
    let qt; $('#mp-q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { VIEW.mapQ = e.target.value; viewAdmin(); const el = $('#mp-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 350); };
    $('#mp-w').onchange = e => { VIEW.mapWarn = e.target.checked; viewAdmin(); };
    A.addEventListener('change', async e => { const el = e.target; if (!el.dataset.mid) return; const id = +el.dataset.mid; const k = el.dataset.k; const val = k === 'ratio' ? num(el.value) : (el.value || null); try { await STORE.updateMappingRow(id, {[k]: val}); const m = D.mapping.find(x => x.id === id); m[k] = val; build(); toast('Đã lưu'); } catch(err){ toast('Lỗi: ' + err.message); } });
    A.addEventListener('click', async e => { const id = e.target.dataset.del; if (!id) return; if (!await confirmBox('Xóa dòng này? FC đã nhập của dòng cũng bị xóa.')) return; try { await STORE.deleteMappingRows([+id]); await reload(); } catch(err){ toast('Lỗi: ' + err.message); } });
  }
  if (t === 'members'){
    A.innerHTML = `<div class="adm"><div class="card"><h3>Thành viên (đăng nhập)</h3><div class="sub" style="margin-bottom:8px">Tên MR phải trùng tên REP Name trong danh sách account. Vai trò: MR (nhập FC của mình), RFFM (xem tất cả), ADMIN.</div>
      <div class="tw" style="max-height:420px"><table class="t"><thead><tr><th class="l">Email</th><th class="l">Tên MR</th><th class="l">Vai trò</th><th></th></tr></thead><tbody id="mb">${D.members.map((m, i) => memRow(m, i)).join('')}</tbody></table></div>
      <div class="bar" style="margin-top:8px"><button class="btn" id="mb-add">+ Thêm</button><button class="btn" id="mb-fill">+ Thêm MR còn thiếu từ danh sách account</button><span class="grow"></span><button class="btn pri" id="mb-save">Lưu</button></div>
      <details style="margin-top:6px"><summary class="sub" style="cursor:pointer">Dán cả danh sách từ Excel (Email | Tên MR | Vai trò)</summary><textarea id="mb-paste" rows="6" style="width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:8px" placeholder="email@bayer.com&#9;Nguyen Van A&#9;MR"></textarea><button class="btn sm" id="mb-parse" style="margin-top:6px">Đưa vào bảng</button></details>
      ${MODE === 'cloud' ? '<div class="sub" style="margin-top:8px">Sau khi lưu: tạo tài khoản đăng nhập cho email đó trong Supabase → Authentication → Users → Add user → Create new user (tick Auto Confirm), đặt mật khẩu tạm và gửi cho MR. Lần đầu đăng nhập app sẽ yêu cầu đổi mật khẩu.</div>' : ''}</div>
      <div class="card"><h3>Giá list / box</h3><div class="tw"><table class="t"><thead><tr><th class="l">SKU</th><th class="l">Brand</th><th>Giá/box (VND)</th></tr></thead><tbody id="pr">${D.prices.map(p => prRow(p)).join('')}</tbody></table></div>
      <div class="bar" style="margin-top:8px"><button class="btn" id="pr-add">+ Thêm SKU</button><span class="grow"></span><button class="btn pri" id="pr-save">Lưu</button></div><div class="sub">Tên SKU phải trùng tên trong raw data (vd thêm Firialta khi có hàng).</div></div></div>`;
    $('#mb-add').onclick = () => $('#mb').insertAdjacentHTML('beforeend', memRow({email: '', rep_name: '', role: 'MR'}));
    $('#mb-fill').onclick = () => { const have = new Set($$('#mb tr').map(tr => norm($('[data-c=rep]', tr).value))); [...new Set(D.mapping.map(m => m.rep_name))].filter(r => !have.has(r)).forEach(r => $('#mb').insertAdjacentHTML('beforeend', memRow({email: '', rep_name: r, role: 'MR'}))); };
    $('#mb-parse').onclick = () => { const lines = $('#mb-paste').value.split(/\r?\n/).map(l => l.split(/\t|,|;/).map(norm)).filter(x => x[0] && x[0].includes('@')); const have = new Map($$('#mb tr').map(tr => [lc($('[data-c=email]', tr).value), tr])); let n = 0;
      for (const [email, rep, role] of lines){ const r = ['MR', 'RFFM', 'ADMIN'].includes((role || '').toUpperCase()) ? role.toUpperCase() : 'MR'; const ex = have.get(lc(email)); if (ex){ $('[data-c=rep]', ex).value = rep || $('[data-c=rep]', ex).value; $('[data-c=role]', ex).value = r; } else { $('#mb').insertAdjacentHTML('beforeend', memRow({email, rep_name: rep || '', role: r})); } n++; }
      const byRep = new Map($$('#mb tr').filter(tr => !$('[data-c=email]', tr).value).map(tr => [lc($('[data-c=rep]', tr).value), tr]));
      $$('#mb tr').filter(tr => $('[data-c=email]', tr).value).forEach(tr => { const blank = byRep.get(lc($('[data-c=rep]', tr).value)); if (blank && blank !== tr) blank.remove(); });
      toast(`Đã đưa ${n} dòng vào bảng, bấm Lưu để ghi.`); };
    $('#mb').addEventListener('click', e => { if (e.target.dataset.rm !== undefined) e.target.closest('tr').remove(); });
    $('#mb-save').onclick = async () => { const list = $$('#mb tr').map(tr => ({email: lc($('[data-c=email]', tr).value), rep_name: norm($('[data-c=rep]', tr).value), role: $('[data-c=role]', tr).value})).filter(m => m.email && m.rep_name); if (!list.some(m => m.role === 'ADMIN')) return toast('Cần ít nhất 1 ADMIN'); try { await STORE.saveMembers(list); toast('Đã lưu thành viên'); await reload(); } catch(e){ toast('Lỗi: ' + e.message); } };
    $('#pr-add').onclick = () => $('#pr').insertAdjacentHTML('beforeend', prRow({sku: '', brand: '', price: ''}));
    $('#pr-save').onclick = async () => { const list = $$('#pr tr').map(tr => ({sku: norm($('[data-c=sku]', tr).value), brand: norm($('[data-c=brand]', tr).value).toUpperCase(), price: num($('[data-c=price]', tr).value)})).filter(p => p.sku && p.price); try { await STORE.savePrices(list); toast('Đã lưu giá'); await reload(); } catch(e){ toast('Lỗi: ' + e.message); } };
  }
}
const memRow = m => `<tr><td class="l"><input data-c="email" value="${esc(m.email)}" placeholder="email" style="width:190px"></td><td class="l"><input data-c="rep" value="${esc(m.rep_name)}" style="width:170px"></td><td class="l"><select data-c="role">${['MR', 'RFFM', 'ADMIN'].map(r => `<option ${r === m.role ? 'selected' : ''}>${r}</option>`).join('')}</select></td><td><button class="btn sm danger" data-rm>✕</button></td></tr>`;
const prRow = p => `<tr><td class="l"><input data-c="sku" value="${esc(p.sku)}" style="width:200px"></td><td class="l"><input data-c="brand" value="${esc(p.brand)}" style="width:90px"></td><td><input data-c="price" value="${p.price}" style="width:110px;text-align:right"></td></tr>`;

boot().catch(e => { $('#app').innerHTML = `<div class="login"><h1>Lỗi khởi động</h1><div class="msg err">${esc(e.message || e)}</div></div>`; });
</script>
