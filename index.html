<script>
'use strict';
/* =========================================================
   1. TIỆN ÍCH
   ========================================================= */
const CFG = window.FC_CONFIG || {};
const MODE = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) ? 'cloud' : 'demo';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const num = v => { if (v === null || v === undefined || v === '') return 0; const n = Number(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
// Số theo chuẩn Bayer: thập phân dấu chấm, nghìn dấu phẩy (1.3 · 63.5% · 1,852 tr)
const nf0 = new Intl.NumberFormat('en-US', {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat('en-US', {maximumFractionDigits: 1, minimumFractionDigits: 1});
const nf2 = new Intl.NumberFormat('en-US', {maximumFractionDigits: 2, minimumFractionDigits: 2});
const tr = v => { if (!v || Math.abs(v) < 5e4) return '–'; const m = v / 1e6; return Math.abs(m) < 100 ? nf1.format(m) : nf0.format(m); };
const big = v => !v ? '0' : (Math.abs(v) >= 1e9 ? nf2.format(v / 1e9) + ' tỷ' : nf0.format(v / 1e6) + ' tr');
const pct = v => { if (v === null || v === undefined || !isFinite(v)) return '–'; const x = Math.round(v * 100); return nf0.format(x === 0 ? 0 : x) + '%'; };
const ratio = (a, b) => b ? a / b : null;
const rto = v => String(Math.round(num(v) * 100) / 100);   // Sales ratio: 0.6 · 0.33 · 1
const growth = (a, b) => b ? a / b - 1 : null;
const pkey = (y, q) => `${y}Q${q}`;
const qlabel = (y, q) => `Q${q}'${String(y).slice(-2)}`;
const pkLabel = pk => { const [y, q] = String(pk).split('Q'); return qlabel(y, q); };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const mlabel = (y, m) => `${MONTHS[m - 1]}'${String(y).slice(-2)}`;
const norm = s => String(s ?? '').trim();
const lc = s => norm(s).toLowerCase();
const nowIso = () => new Date().toISOString();
const fcVal = v => v === null || v === undefined || v === '' ? null : Number(v);   // ô FC: trống = null
// Demo: giống trigger DB bản 5, sửa số tháng thì bỏ dấu tự dời (↻)
const keepAuto = (o, n) => o && o.auto_note && [1, 2, 3].every(i => fcVal(o['m' + i]) === fcVal(n['m' + i])) ? {auto_note: o.auto_note, auto_at: o.auto_at} : {};
// Ngày giờ: dd/mm/yyyy, giờ 24h (không phụ thuộc định dạng của trình duyệt)
const two = n => String(n).padStart(2, '0');
const dmy = d => `${two(d.getDate())}/${two(d.getMonth() + 1)}/${d.getFullYear()}`;
const hm = d => `${two(d.getHours())}:${two(d.getMinutes())}`;
const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso); return `${hm(d)} ${two(d.getDate())}/${two(d.getMonth() + 1)}`; };
const ddmm = iso => iso ? `${String(iso).slice(8, 10)}/${String(iso).slice(5, 7)}` : '';
// Lý do điều chỉnh FC (thuật ngữ Bayer) · nhóm issue tương ứng trên dashboard RFFM / admin
const REASON_DEF = [['Thầu mới / first order', 'Thầu / quota'], ['Out of quota / gap thầu', 'Thầu / quota'], ['MSBS 30% / stock up quota', 'Thầu / quota'], ['Tồn kho BV cao / sell-out chậm', 'Tồn kho'],
  ['Vượt quỹ BHYT / khoá thuốc', 'Vượt quỹ BHYT / khoá thuốc'], ['Gx / đối thủ gain share', 'Gx / đối thủ'], ['Listing mới / BS mới kê toa', 'HCP / listing'], ['BS ngưng kê / BS nghỉ', 'HCP / listing'],
  ['Thay đổi ratio / phân bổ account', 'Phân bổ account'], ['Khác (ghi rõ ở Note)', '']];
const REASONS = REASON_DEF.map(x => x[0]);
// Nhãn lý do bản trước → nhãn mới (số cũ trong database, file Excel xuất trước đây)
const REASON_OLD = {'Trúng thầu / thầu mới': 'Thầu mới / first order', 'Hết thầu / chờ kết quả thầu': 'Out of quota / gap thầu', 'Tồn kho tại BV cao': 'Tồn kho BV cao / sell-out chậm', 'Vượt quỹ BHYT / khóa thuốc': 'Vượt quỹ BHYT / khoá thuốc',
  'Đối thủ / generic cạnh tranh': 'Gx / đối thủ gain share', 'Listing mới / BS mới kê': 'Listing mới / BS mới kê toa', 'Mất BS kê / BS nghỉ': 'BS ngưng kê / BS nghỉ', 'Thay đổi phân bổ account': 'Thay đổi ratio / phân bổ account', 'Khác (ghi rõ ở ghi chú)': 'Khác (ghi rõ ở Note)'};
const normReason = x => x ? (REASON_OLD[x] || x) : x;
// Kênh: giữ giá trị gốc trong data (Tender / Self-pay / Other), hiển thị theo cách gọi của team
const CH_LABEL = {'Tender': 'Khoa Dược (tender)', 'Self-pay': 'NTBV (self-pay)'};
const chLabel = c => CH_LABEL[c] || c;
const chSort = (x, y) => { const i = v => { const k = ['Tender', 'Self-pay', 'Other'].indexOf(v); return k >= 0 ? k : v === '(chưa gán)' ? 99 : 50; }; return i(x) - i(y) || String(x).localeCompare(String(y)); };
const OTHER = REASONS[REASONS.length - 1];
const DEMO_NOTES = ['Gap thầu, chờ kết quả thầu T12', '', '', 'Tồn kho BV ~2,000 hộp, sell-out chậm', '', '', '', 'Vượt quỹ BHYT, Khoa Dược tạm khoá thuốc đến hết T11', '', '', 'Gx trúng thầu, BS chuyển toa một phần', '', '', 'Thầu mới, first order est. T11', '', '', ''];
const STATUS = {draft: ['Chưa submit', 'no'], submitted: ['Đã submit · chờ duyệt', 'sb'], approved: ['Đã duyệt', 'ok'], returned: ['Trả lại', 'no']};
function achClass(a){ if (a === null || a === undefined) return ''; return a >= 1 ? 'good' : (a < 0.8 ? 'bad' : 'mid'); }
// % đạt target: nhãn có thanh tiến độ (KHÔNG dùng mũi tên để không lẫn với tăng trưởng)
function achHtml(a, cls){ if (a === null || a === undefined || !isFinite(a)) return '<span class="muted">–</span>'; const c = cls || achClass(a); const w = Math.max(0, Math.min(100, a * 100)); return `<span class="ach ${c}" data-tip="%Ach ${pct(a)}"><span class="ab"><i style="width:${w}%"></i></span>${pct(a)}</span>`; }
// % đạt QTD: so với tiến độ thời gian đã qua của quý
const paceClass = a => { if (a === null || a === undefined) return ''; const r = PACE ? a / PACE : 1; return r >= 1 ? 'good' : (r < 0.85 ? 'bad' : 'mid'); };
const achQHtml = a => achHtml(a, paceClass(a));
// Độ chính xác FC: nhãn viền (khác hình thức với % đạt)
function accHtml(a){ if (a === null || a === undefined) return '<span class="muted">–</span>'; const c = a >= 0.85 ? 'good' : (a < 0.7 ? 'bad' : 'mid'); return `<span class="accp ${c}">${pct(a)}</span>`; }
// Tăng trưởng: mũi tên + dấu, không nền
function grHtml(g){ if (g === null || g === undefined || !isFinite(g)) return '<span class="muted">–</span>'; const x = Math.round(g * 100); const c = x > 0 ? 'up' : (x < 0 ? 'down' : 'flat'); return `<span class="gr ${c}">${x > 0 ? '↑ +' : x < 0 ? '↓ −' : '→ '}${nf0.format(Math.abs(x))}%</span>`; }

  const pick = a => a[Math.floor(rnd() * a.length)];
  const ho = ['Nguyen', 'Tran', 'Le', 'Pham', 'Hoang', 'Vo', 'Dang', 'Bui', 'Do', 'Ngo'];

  const reps = ten.map((t, i) => `${ho[i % ho.length]} ${dem[i % dem.length]} ${t}`);
  const members = reps.map((r, i) => ({email: `mr${String(i + 1).padStart(2, '0')}@demo.vn`, rep_name: r, role: 'MR'}));
  members.unshift({email: 'rffm@demo.vn', rep_name: 'RFFM Demo', role: 'RFFM'});
  members.unshift({email: 'admin@demo.vn', rep_name: 'Admin (bạn)', role: 'ADMIN'});
  const prices = [

    {sku: "XARELTO TAB 10MG 10'S", brand: 'XARELTO', price: 550000}, {sku: 'XARELTO 2.5mg 14 TABL', brand: 'XARELTO', price: 360000},
    {sku: "ADALAT LA TAB 30MG 30'S", brand: 'ADALAT', price: 270000}];

  const mapping = [], sales = [], targets = [], archive = [], fc = {}; let id = 1;
  for (let a = 0; a < 96; a++){

    const brands = rnd() < .55 ? ['ADALAT', 'XARELTO'] : (rnd() < .7 ? ['XARELTO'] : ['ADALAT']);
    for (const p of prices){
      if (!brands.includes(p.brand)) continue;
      const base = (p.brand === 'ADALAT' ? 120 : 90) * (0.3 + rnd() * 2.2) * (a % 9 === 0 ? 6 : 1);
      const mid = id++; mapping.push({id: mid, rep_name: rep, cust_code: code, cust_name: name, brand: p.brand, sku: p.sku, ratio: 1, channel: ch, status: 'active'});
      let lvl = base; const qBox = [];
      qs.forEach(h => { lvl = Math.max(0, lvl * (0.85 + rnd() * 0.35)); const box = Math.round(lvl * (rnd() < .12 ? 0 : 1)); qBox.push(box);
        const w0 = .3 + rnd() * .1, w1 = .3 + rnd() * .1; const ws = [w0, w1, 1 - w0 - w1];
        ws.forEach((w, k) => { const mo = (h.q - 1) * 3 + k + 1; let mb = Math.round(box * w); if (h.y === 2026 && h.q === 4){ if (k === 1) mb = Math.round(mb * .3); if (k === 2) mb = 0; }
          if (mb) sales.push({cust_code: code, sku: p.sku, year: h.y, month: mo, value: mb * p.price * (0.98 + rnd() * .04), qty: mb}); }); });
      const tg = Math.round((qBox[5] + qBox[6]) / 2 * (1.05 + rnd() * .15));
      if (tg) targets.push({cust_code: code, sku: p.sku, value: tg * p.price});
      if (qBox[6] || rnd() < .15){ const fb = Math.round(qBox[6] * (0.65 + rnd() * .7) / 3); if (fb) archive.push({period: '2026Q3', rep_name: rep, cust_code: code, sku: p.sku, ratio: 1, m1: fb, m2: fb, m3: fb, value: fb * 3 * p.price, created_at: '2026-10-01T02:00:00Z'}); }
      if (reps.indexOf(rep) % 3 !== 2 && tg){
        const m = Math.max(0, Math.round(tg / 3 * (0.8 + rnd() * .35))); const r0 = rnd(); const mult = r0 < .06 ? 2.6 : (r0 < .1 ? 0 : 1);
        fc[mid] = {m1: Math.round(m * mult), m2: Math.round(m * mult * (0.9 + rnd() * .2)), m3: Math.round(m * mult * (0.9 + rnd() * .3)), note: DEMO_NOTES[mid % DEMO_NOTES.length], reason: mult !== 1 && rnd() < .5 ? pick(REASONS.slice(0, 7)) : null, updated_at: '2026-11-05T03:00:00Z', updated_by: ''};

  sales.push({cust_code: '30199991', sku: "XARELTO TAB 15MG 14'S", year: 2026, month: 9, value: 46400000, qty: 62}, {cust_code: '30199991', sku: "ADALAT LA TAB 30MG 30'S", year: 2026, month: 8, value: 8100000, qty: 30});
  const subs = {};
  reps.forEach((r, i) => { if (i % 3 === 2) return; const t = new Date(Date.parse('2026-11-08T09:00:00Z') - i * 3.6e6).toISOString();
    if (i % 6 === 0) subs[r] = {status: 'approved', submitted_at: t, submitted_by: '', reviewed_by: 'rffm@demo.vn', reviewed_at: '2026-11-09T02:00:00Z', review_note: null};
    else if (i === 4) subs[r] = {status: 'returned', submitted_at: t, submitted_by: '', reviewed_by: 'rffm@demo.vn', reviewed_at: '2026-11-09T03:00:00Z', review_note: 'Chợ Rẫy Xa20 FC thấp so với quota thầu mới, xem lại FC Dec'};
    else subs[r] = {status: 'submitted', submitted_at: t, submitted_by: ''}; });
  return {settings, members, prices, mapping, sales, seen, archive, targets: {[pkey(2026, 4)]: targets}, fc: {[pkey(2026, 4)]: fc}, subs: {[pkey(2026, 4)]: subs}, nextId: id};
}

const LS_KEY = 'fcapp_demo_v2';
class DemoStore {
  constructor(){ this.db = lsGet(LS_KEY) || seedDemo(); this.persist(); this.user = lsGet(LS_KEY + '_user'); }
  persist(){ lsSet(LS_KEY, this.db); }
  async currentEmail(){ return this.user; }
  async signInDemo(email){ this.user = email; lsSet(LS_KEY + '_user', email); }
  async signOut(){ this.user = null; lsSet(LS_KEY + '_user', null); }
  async loadAll(){
    const d = this.db; const pk = pkey(d.settings.year, d.settings.quarter);
    return {settings: {...d.settings}, members: d.members, prices: d.prices, mapping: d.mapping, sales: d.sales, seen: d.seen, archive: d.archive || [],
      targets: d.targets[pk] || [], fc: d.fc[pk] || {}, subs: d.subs[pk] || {}, dbv: 5};
  }
  async customerNames(){ const m = new Map(); [...this.db.mapping, ...(this.db.seen || [])].forEach(x => { if (x.cust_name && !m.has(x.cust_code)) m.set(x.cust_code, x.cust_name); }); return [...m]; }
  async saveFC(period, mid, rec){ const t = (this.db.fc[period] ||= {}); t[mid] = {...rec, ...keepAuto(t[mid], rec), updated_at: nowIso(), updated_by: this.user}; this.persist(); }
  async upsertFC(period, list){ const t = (this.db.fc[period] ||= {}); list.forEach(r => t[r.mapping_id] = {m1: r.m1, m2: r.m2, m3: r.m3, note: r.note, reason: r.reason || null, ...keepAuto(t[r.mapping_id], r), updated_at: nowIso(), updated_by: this.user}); this.persist(); }
  // Tự trừ sales vào FC: chỉ ghi dòng còn đúng số cũ (o1..o3), giữ người sửa / giờ sửa của MR
  async rollFC(period, list){ const t = (this.db.fc[period] ||= {}); let n = 0;
    for (const x of list){ const f = t[x.mapping_id]; if (!f || ![1, 2, 3].every(i => fcVal(f['m' + i]) === fcVal(x['o' + i]))) continue; t[x.mapping_id] = {...f, m1: x.m1, m2: x.m2, m3: x.m3, auto_note: x.note, auto_at: nowIso()}; n++; }
    this.persist(); return n; }
  async submit(period, rep){ (this.db.subs[period] ||= {})[rep] = {status: 'submitted', submitted_at: nowIso(), submitted_by: this.user, reviewed_by: null, reviewed_at: null, review_note: null}; this.persist(); }
  async review(period, rep, status, note){ const t = (this.db.subs[period] ||= {}); t[rep] = {...(t[rep] || {}), status, review_note: note || null, reviewed_by: this.user, reviewed_at: nowIso()}; this.persist(); }
  async saveSettings(s){ this.db.settings = {...this.db.settings, ...s}; this.persist(); }
  async replaceSales(rows, seen){ this.db.sales = rows; this.db.seen = seen; this.persist(); }
  async replaceTargets(period, rows){ this.db.targets[period] = rows; this.persist(); }
  async replaceArchive(periods, rows){ this.db.archive = (this.db.archive || []).filter(a => !periods.includes(a.period)).concat(rows.map(r => ({...r, created_at: nowIso()}))); this.persist(); }
  async savePrices(list){ this.db.prices = list; this.persist(); }
  async saveMembers(list){ this.db.members = list; this.persist(); }
  async upsertMapping(rows, deleteMissing){
    const key = r => `${r.rep_name}|${r.cust_code}|${r.sku}`; const cur = new Map(this.db.mapping.map(r => [key(r), r])); const keep = new Set();
    for (const r of rows){ const k = key(r); keep.add(k); if (cur.has(k)) Object.assign(cur.get(k), {cust_name: r.cust_name, brand: r.brand, ratio: r.ratio, channel: r.channel, status: r.status || 'active'}); else { const n = {...r, status: r.status || 'active', id: this.db.nextId++}; this.db.mapping.push(n); cur.set(k, n); } }
    if (deleteMissing) this.db.mapping = this.db.mapping.filter(r => keep.has(key(r)) || r.status === 'proposed');
    this.persist(); return this.db.mapping;
  }
  async proposeMapping(row){ const n = {...row, id: this.db.nextId++}; this.db.mapping.push(n); this.persist(); return n; }
  async approveMapping(ids){ const s = new Set(ids); this.db.mapping.forEach(m => { if (s.has(m.id)) m.status = 'active'; }); this.persist(); }
  async updateMappingRow(id, patch){ const r = this.db.mapping.find(x => x.id === id); Object.assign(r, patch); this.persist(); }
  async deleteMappingRows(ids){ const s = new Set(ids); this.db.mapping = this.db.mapping.filter(r => !s.has(r.id)); this.persist(); }
  reset(){ this.db = seedDemo(); this.persist(); }
}

class CloudStore {
  constructor(sb){ this.sb = sb; }
  async currentEmail(){ const {data} = await this.sb.auth.getSession(); return data.session?.user?.email?.toLowerCase() || null; }
  async signInPassword(email, pw){ const {error} = await this.sb.auth.signInWithPassword({email, password: pw}); if (error) throw error; }
  async sendLink(email){ const {error} = await this.sb.auth.signInWithOtp({email, options: {shouldCreateUser: false, emailRedirectTo: location.href.split('#')[0]}}); if (error) throw error; }
  async signOut(){ await this.sb.auth.signOut(); }
  async getUser(){ const {data} = await this.sb.auth.getUser(); return data.user; }
  async setPassword(pw){ const {error} = await this.sb.auth.updateUser({password: pw, data: {pw_changed: true}}); if (error) throw error; }

function derive(r){

  r.rem = MST.map((st, i) => st === 'current' && has(raw[i]) ? Math.max(0, num(raw[i]) - r.mtdBox[i]) : null);
  r.boxM = MST.map((st, i) => st === 'closed' ? r.qtyM[i] : st === 'current' ? r.qtyM[i] + num(r.rem[i]) : num(raw[i]));
  r.fcvM = MST.map((st, i) => st === 'closed' ? r.actM[i] : st === 'current' ? r.actM[i] + num(r.rem[i]) * pr : num(raw[i]) * pr);

  r.flag = '';
  if (r.filled && Math.max(r.baseV, r.fcv) >= RULE.min){
    if (!r.baseV) r.flag = 'Có FC nhưng 2Q gần nhất chưa có sales';
    else if (!r.fcv) r.flag = 'FC = 0 trong khi đang có sales';
    else { const dv = r.fcv / r.baseV - 1; if (Math.abs(dv) > RULE.pct) r.flag = `FC ${dv > 0 ? 'cao' : 'thấp'} hơn TB 2Q ${pct(Math.abs(dv))}`; }

}

function build(){

function agg(rows){

function findHeader(rows, mustHave){ for (let i = 0; i < Math.min(rows.length, 30); i++){ const r = (rows[i] || []).map(lc); if (mustHave.every(h => r.includes(lc(h)))) return i; } return -1; }
function colIdx(hdr, names){ const h = hdr.map(lc); for (const n of names){ const i = h.indexOf(lc(n)); if (i >= 0) return i; } return -1; }
function findSheet(wb, prefer, mustHave){ for (const n of [...prefer, ...wb.SheetNames]){ if (!wb.Sheets[n]) continue; const rows = sheetRows(wb.Sheets[n]); const hi = findHeader(rows, mustHave); if (hi >= 0) return {rows, hi, hdr: rows[hi]}; } return null; }

function fcRollPlan(snap){
  const open = [0, 1, 2].filter(i => MST[i] !== 'closed'); if (!snap || snap.pk !== PK || !open.length) return [];
  const mon = i => MONTHS[MS[i] - 1], sg = x => (x > 0 ? '+' : '−') + nf0.format(Math.abs(x)), out = [];
  for (const r of ROWS){
    const s = snap.rows.get(r.id); if (!s) continue;
    const o = [r.f.m1, r.f.m2, r.f.m3].map(fcVal); if (o.some((x, i) => x !== s.m[i])) continue;   // vừa có người sửa: để nguyên
    const dm = [0, 1, 2].map(i => s.boxM[i] - r.boxM[i]);   // > 0: tháng i thấp hơn FC, < 0: vượt FC
    const d = Math.round(dm[0] + dm[1] + dm[2]); if (!d) continue;
    const m = [...o], mv = [0, 0, 0]; let left = 0;
    if (d > 0){ const i = open[0]; m[i] = (MST[i] === 'current' ? Math.max(num(o[i]), r.mtdBox[i]) : num(o[i])) + d; mv[i] = d; }
    else { left = -d;
      for (const i of open){ if (!left || o[i] === null) continue; const t = Math.min(left, Math.max(0, o[i] - (MST[i] === 'current' ? r.mtdBox[i] : 0))); if (t > 0){ m[i] = o[i] - t; mv[i] = -t; left -= t; } }
      if (!mv.some(Boolean)) continue; }
    const why = [0, 1, 2].filter(i => Math.round(dm[i])).map(i => `${mon(i)} ${dm[i] < 0 ? 'vượt' : 'thấp hơn'} FC ${nf0.format(Math.abs(Math.round(dm[i])))}`).join(', ');
    const line = `Sales đến ${ASOF_DM}: ${why || (d < 0 ? 'sales vượt FC ' + nf0.format(-d) : 'sales thấp hơn FC ' + nf0.format(d))} box → ${[0, 1, 2].filter(i => mv[i]).map(i => `${mon(i)} ${sg(mv[i])}`).join(', ')}${left ? ` (vượt cả FC quý ${nf0.format(left)} box)` : ''}`;

    D = await STORE.loadAll(); build();
    if (D.dbv < 5) return log('Tự trừ sales vào FC: chưa chạy, database chưa nâng cấp bản 5 (Supabase → SQL Editor → chạy migration_v5.sql).');
    // File cũ hơn hoặc thiếu dữ liệu (sales quý giảm > 3%): không dời, tránh dời FC theo số sai
    if (+ASOF < snap.asof) return log(`Tự trừ sales vào FC: bỏ qua vì ngày dữ liệu của file (${ASOF_DM}) cũ hơn bản đang có. FC giữ nguyên.`);
    const qv = qSales(); if (snap.qv > 0 && qv < snap.qv * 0.97) return log(`Tự trừ sales vào FC: bỏ qua vì sales ${P[4].label} của file thấp hơn bản đang có ${pct(1 - qv / snap.qv)}, có thể file thiếu dữ liệu. FC giữ nguyên; kiểm tra file rồi nạp lại.`);
    const plan = fcRollPlan(snap);
    if (!plan.length) return log('Tự trừ sales vào FC: không dòng nào phải dời (sales mới chưa vượt / thấp hơn FC tháng).');
    const n = await STORE.rollFC(PK, plan.map(p => ({mapping_id: p.r.id, m1: p.m[0], m2: p.m[1], m3: p.m[2], o1: p.o[0], o2: p.o[1], o3: p.o[2], note: p.note})));
    const tot = [0, 1, 2].map(i => plan.reduce((t, p) => t + p.mv[i], 0)), nRep = new Set(plan.map(p => p.r.rep_name)).size, nOver = plan.filter(p => p.left).length;
    log(`Tự trừ sales vào FC: dời ${n} dòng của ${nRep} MR (${[0, 1, 2].filter(i => tot[i]).map(i => `${MONTHS[MS[i] - 1]} ${tot[i] > 0 ? '+' : '−'}${nf0.format(Math.abs(tot[i]))} box`).join(', ')}), FC quý từng dòng giữ nguyên${nOver ? `; ${nOver} dòng sales đã vượt cả FC quý` : ''}.${n < plan.length ? ` Bỏ qua ${plan.length - n} dòng vừa có người sửa.` : ''}`);
  } catch(e){ log('Tự trừ sales vào FC: lỗi, chưa dời được (' + e.message + '). Sales mới đã nạp xong.'); }
}

  }
}
const memRow = m => `<tr><td class="l"><input data-c="email" value="${esc(m.email)}" placeholder="email" style="width:190px"></td><td class="l"><input data-c="rep" value="${esc(m.rep_name)}" style="width:170px"></td><td class="l"><select data-c="role">${['MR', 'RFFM', 'ADMIN'].map(r => `<option ${r === m.role ? 'selected' : ''}>${r}</option>`).join('')}</select></td><td><button class="btn sm danger" data-rm>✕</button></td></tr>`;
const prRow = p => `<tr><td class="l"><input data-c="sku" value="${esc(p.sku)}" style="width:200px"></td><td class="l"><input data-c="brand" value="${esc(p.brand)}" style="width:90px"></td><td><input data-c="price" value="${p.price}" style="width:110px;text-align:right"></td></tr>`;

boot().catch(e => { $('#app').innerHTML = `<div class="login"><h1>Lỗi khởi động</h1><div class="msg err">${esc(e.message || e)}</div></div>`; });
</script>
</body>
</html>
