  { let s4 = 20261113; const r4 = () => (s4 = (s4 * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const now = Date.now(), H = 36e5, W = 7 * 864e5, from = new Date(now - 6 * W + 7 * H).toISOString().slice(0, 10);
    teams.forEach(t => Object.assign(t, {wk_dow: t.team === 'WHC' ? 1 : 2, wk_time: '13:00', wk_from: from}));
    [reps[1], 'Le Ngoc Han'].forEach(r => { const m = members.find(x => x.rep_name === r); if (m) m.cfo = true; });
    const dueAfter = (t0, dow) => { const p = vnP(t0); let d = vnAt(p.y, p.m, p.d, 13, 0) + ((dow - p.dow + 7) % 7) * 864e5; if (d < t0) d += W; return d; };
    const ev = (rep, status, t) => wlog.push({id: id++, period: pkey(2026, 4), rep_name: rep, status, at: new Date(t).toISOString(), by_email: ''});
    for (const t of teams){ const open = dueAfter(now, t.wk_dow), dues = [6, 5, 4, 3, 2, 1].map(k => open - k * W);
      for (const m of members.filter(x => x.role === 'MR' && (x.team || 'CVRM') === t.team)){ const sb = subs[m.rep_name], apr = sb && sb.status === 'approved' ? Date.parse(sb.reviewed_at) : Infinity;
        for (const d of dues){ const r = r4(), at = r < .72 ? d - (2 + r4() * 70) * H : r < .87 ? d + (5 + r4() * 380) * 6e4 : null; if (at && at < apr - H) ev(m.rep_name, 'submitted', at); }
        if (apr < Infinity){ ev(m.rep_name, 'approved', apr); continue; }
        if (r4() < .5 && now > open - 6 * 864e5) ev(m.rep_name, 'submitted', now - r4() * Math.min(now - (open - 6 * 864e5), 3 * 864e5)); } }
    // Số FC theo brand lúc Submit (ước lượng cho demo): FC box × giá, target / sales LYSP, quý trước theo ratio
    const pr = new Map(prices.map(p => [p.sku, p])), sq = (c, s, y, q) => sales.filter(x => x.cust_code === c && x.sku === s && x.year === y && Math.floor((x.month - 1) / 3) + 1 === q).reduce((t, x) => t + x.value, 0);
    const done = new Set(wlog.filter(e => e.status === 'submitted').map(e => e.rep_name)), by = new Map();
    for (const m of mapping){ const p = pr.get(m.sku); if (!p || p.launch || m.status !== 'active' || !done.has(m.rep_name)) continue; const k = m.rep_name + '|' + m.brand, f = fc[m.id], rt = num(m.ratio);
      const o = by.get(k) || {period: pkey(2026, 4), rep_name: m.rep_name, brand: m.brand, team: m.team || 'CVRM', fcv: 0, tgt: 0, act_ly: 0, act_lq: 0, act_qtd: 0, n_rows: 0, n_filled: 0};
      o.n_rows++; if (f){ o.n_filled++; o.fcv += (num(f.m1) + num(f.m2) + num(f.m3)) * p.price * rt; }
      o.tgt += targets.filter(x => x.cust_code === m.cust_code && x.sku === m.sku).reduce((t, x) => t + x.value, 0) * rt;
      o.act_ly += sq(m.cust_code, m.sku, 2025, 4) * rt; o.act_lq += sq(m.cust_code, m.sku, 2026, 3) * rt; o.act_qtd += sq(m.cust_code, m.sku, 2026, 4) * rt; by.set(k, o); }
    const last = new Map(); wlog.filter(e => e.status === 'submitted').forEach(e => last.set(e.rep_name, e.at));
    by.forEach(o => snaps.push({...o, fcv: Math.round(o.fcv), tgt: Math.round(o.tgt), act_ly: Math.round(o.act_ly), act_lq: Math.round(o.act_lq), act_qtd: Math.round(o.act_qtd), at: last.get(o.rep_name), by_email: ''})); }
  return {settings, members, prices, mapping, sales, seen, archive, teams, customers, merges, tenders, tupc, wlog, snaps, targets: {[pkey(2026, 4)]: targets, '2026FY': tgtFY}, fc: {[pkey(2026, 4)]: fc}, subs: {[pkey(2026, 4)]: subs}, nextId: id};
}

// Khoá chính từng bảng: đọc theo trang thì xếp theo khoá chính để các trang không trùng / sót dòng
const PKS = {sales_agg: ['cust_code', 'sku', 'year', 'month'], accounts_seen: ['cust_code', 'sku'], fc_archive: ['period', 'rep_name', 'cust_code', 'sku'], targets: ['period', 'rep_name', 'cust_code', 'sku'],
  fc_entries: ['period', 'mapping_id'], submissions: ['period', 'rep_name'], team_members: ['email'], prices: ['sku'], settings: ['id'], customers: ['cust_code'], cust_merge: ['cust_code'],
  submit_log: ['id'], fc_snap: ['period', 'rep_name', 'brand'], fc_notes: ['period', 'cust_code', 'sku', 'by_email']};
class CloudStore {
  constructor(sb){ this.sb = sb; }
  async currentEmail(){ const {data} = await this.sb.auth.getSession(); return data.session?.user?.email?.toLowerCase() || null; }
  async signInPassword(email, pw){ const {error} = await this.sb.auth.signInWithPassword({email, password: pw}); if (error) throw error; }
  async sendLink(email){ const {error} = await this.sb.auth.signInWithOtp({email, options: {shouldCreateUser: false, emailRedirectTo: location.href.split('#')[0]}}); if (error) throw error; }
  async signOut(){ await this.sb.auth.signOut({scope: 'local'}); }   // bản 4.21.4: chỉ đăng xuất máy đang dùng (mặc định của Supabase là đăng xuất mọi thiết bị)
  async getUser(){ const {data} = await this.sb.auth.getUser(); return data.user; }
  async setPassword(pw){ const {error} = await this.sb.auth.updateUser({password: pw, data: {pw_changed: true}}); if (error) throw error; }
  // Đọc cả bảng theo trang 1000 dòng (giới hạn mặc định của Supabase): trang đầu kèm tổng số dòng, các trang sau tải song song.
  // Không đọc được tổng số dòng, hoặc trang cuối vẫn đầy (vừa có dữ liệu mới) → đọc tiếp từng trang như cũ, không bỏ sót dòng.
  async all(table, sel = '*', f){
    const page = (from, cnt) => { let q = this.sb.from(table).select(sel, cnt ? {count: 'exact'} : {}).range(from, from + 999); for (const c of PKS[table] || []) q = q.order(c); if (f) q = f(q); return q; };
    const {data, error, count} = await page(0, true); if (error) throw error;
    const out = [...data]; if (data.length < 1000) return out;
    const n = count > 1000 ? Math.ceil(count / 1000) : 1;
    const rest = await Promise.all(Array.from({length: n - 1}, (_, i) => page((i + 1) * 1000)));
    let last = data; for (const r of rest){ if (r.error) throw r.error; out.push(...r.data); last = r.data; }
    for (let from = n * 1000; last.length === 1000; from += 1000){ const r = await page(from); if (r.error) throw r.error; out.push(...r.data); last = r.data; }
    return out;
  }
  // Kiểm tra database đã đủ cột của các bản trước: 1 lần mỗi phiên, 6 bảng gửi song song
  async checkSchema(){
    if (this.schemaOK) return;
    const res = await Promise.all([['sales_agg', 'month,qty,team'], ['fc_archive', 'period,team'], ['submissions', 'status'], ['mapping', 'status,team'], ['fc_entries', 'reason'], ['targets', 'rep_name,qty,team'], ['teams', 'team,data_as_of']]
      .map(async ([t, c]) => [t, (await this.sb.from(t).select(c).limit(1)).error]));
    const bad = res.find(x => x[1]); if (bad){ const e = new Error('DB_MIGRATION'); e.detail = `${bad[0]}: ${bad[1].message}`; throw e; }
    this.schemaOK = true;
  }
  async loadAll(){
    await this.checkSchema();
    const st = await this.all('settings'); const settings = st[0] || {year: new Date().getFullYear(), quarter: Math.floor(new Date().getMonth() / 3) + 1, locked: false, team_filter: 'CVRM', exclude_keywords: 'Vacant,New MR,Uncovered'};
    const pk = pkey(settings.year, settings.quarter);
    const [members, prices, mapping, sales, seen, archive, targets, fcRows, subRows, dbv, teams, customers, merges, tgtFY, tenders, tupc, wlog, snaps, wkp, notes, promos] = await Promise.all([
      this.all('team_members'), this.all('prices'), this.all('mapping', '*', q => q.order('id')), this.all('sales_agg'), this.all('accounts_seen'), this.all('fc_archive'),
      this.all('targets', '*', q => q.eq('period', pk)), this.all('fc_entries', '*', q => q.eq('period', pk)), this.all('submissions', '*', q => q.eq('period', pk)), this.dbVersion(), this.all('teams'),
      this.all('customers').catch(() => []), this.all('cust_merge').catch(() => []), this.all('targets', '*', q => q.eq('period', settings.year + 'FY')).catch(() => []),
      this.all('tenders', '*', q => q.order('id')).catch(() => []), this.all('tender_upcoming', '*', q => q.order('id')).catch(() => []),   // tenders / tender_upcoming từ DB bản 10   // customers có từ DB bản 7, cust_merge từ bản 8; Target FY theo brand: kỳ YYYYFY
      this.all('submit_log', '*', q => q.gte('at', new Date(Date.now() - 16 * 7 * 864e5).toISOString())).catch(() => []), this.all('fc_snap', '*', q => q.eq('period', pk)).catch(() => []),   // nộp FC tuần + CFO: DB bản 13
      this.sb.rpc('wk_people').then(({data, error}) => error ? null : data).catch(() => null), this.all('fc_notes', '*', q => q.eq('period', pk)).catch(() => []),   // người nộp FC tuần, ghi chú cả team: DB bản 14
      this.all('promos', '*', q => q.order('id')).catch(() => [])]);   // chương trình trade: DB bản 15
    const fc = {}; fcRows.forEach(r => fc[r.mapping_id] = r); const subs = {}; subRows.forEach(r => subs[r.rep_name] = r);
    return {settings, members, prices, mapping, sales, seen, archive, targets, tgtFY, fc, subs, dbv, teams, customers, merges, tenders, tupc, wlog, snaps, wkp: Array.isArray(wkp) && wkp.length ? wkp : null, notes, promos: dbv >= 15 ? promos : []};   // promos.channels từ DB bản 16
  }

const PCH = ['Tender', 'Self-pay', 'Clinic'], PCH_KEY = {'Tender': 'price_tender', 'Self-pay': 'price_selfpay', 'Clinic': 'price_clinic'};

function priceSuggest(){
  const qs = [P[3], P[4]].map(p => p.y * 4 + p.q), acc = new Map(), add = (o, g, b, u) => { const m = o[g] || (o[g] = new Map()); const x = m.get(b) || {n: 0, s: 0}; x.n++; x.s += u; m.set(b, x); };
  // Chỉ lấy account của team trên app (raw có cả nhà thuốc lẻ, tỉnh khác mua giá khác); SKU chưa có account nào thì lấy cả raw
  const mine = new Set(D.mapping.map(m => m.cust_code)), skuMine = new Set(D.sales.filter(r => mine.has(r.cust_code)).map(r => r.sku));

    if (skuMine.has(r.sku) && !mine.has(r.cust_code)) continue;
    const pc = pchOfCode(r.cust_code), u = v / qn, b = Math.round(u / 100) * 100, o = acc.get(r.sku) || {}; if (pc) add(o, pc, b, u); if (pc !== 'Clinic') add(o, 'hosp', b, u); acc.set(r.sku, o); }

  const toPrice = tr => { const b = num(val(tr, 'base')), d = val(tr, 'disc'); if (b && d !== '') set(tr, 'price', Math.round(b * (1 - num(d) / 100))); };
  const toDisc = tr => { const b = num(val(tr, 'base')), p = num(val(tr, 'price')); if (b && p) set(tr, 'disc', Math.round((1 - p / b) * 1000) / 10); };
  const fillBase = tr => { const sku = val(tr, 'sku'), ch = val(tr, 'ch'); if (!sku) return; const b = ch ? priceOf(sku, ch) : num(PRICES.get(sku)?.price); if (b) { set(tr, 'base', b); toPrice(tr); } };

    const list = $$('#prm tr').map(tr => ({id: num(tr.dataset.pid) || null, sku: val(tr, 'sku'), name: norm(val(tr, 'name')), base_price: num(val(tr, 'base')) || null,
      disc: val(tr, 'disc') === '' ? null : num(val(tr, 'disc')) / 100, price: num(val(tr, 'price')), date_from: val(tr, 'from'), date_to: val(tr, 'to'), team: SKU_TEAM.get(val(tr, 'sku')) || null,

  const btn = $('#refresh'); if (btn){ btn.disabled = true; btn.classList.add('spin'); }
  const ae = document.activeElement, focus = ae && ae !== document.body ? {id: ae.id, did: ae.dataset?.id, f: ae.dataset?.f} : null; const y = scrollY;
  try {
    await flushSaves();

    const nd = await STORE.loadAll(); D = nd; LOADED_AT = new Date(); SAVE_ERR = false;

  } catch(e){ toast('Không tải được dữ liệu: ' + e.message, 4500); }

}

// Tra cứu ở bản demo (giống hàm find_account của DB bản 14)
function findAccountLocal(q, mapping, customers, seen, merges, members){
  const t = norm(q); if (t.length < 2) return []; const d = phoneNorm(t), f = fold(t), ws = f.split(' ').filter(Boolean);
  const acc = new Map(), put = (c, n, a, sg, raw) => { const o = acc.get(c) || {cust_code: c, cust_name: '', address: '', segment: null, in_raw: false}; if (n && (!o.cust_name || raw)) o.cust_name = n; if (a && !o.address) o.address = a; if (sg && !o.segment) o.segment = sg; if (raw) o.in_raw = true; acc.set(c, o); };
  customers.forEach(c => put(c.cust_code, c.cust_name, c.address, c.segment, true)); mapping.forEach(m => put(m.cust_code, m.cust_name, m.address, m.segment, false)); seen.forEach(x => put(x.cust_code, x.cust_name, '', null, false));
  const mg = new Map(merges.map(m => [m.cust_code, m])), nm = e => (members.find(m => lc(m.email) === lc(e)) || {}).rep_name || e || null;
  const score = x => { const pc = phoneNorm(x.cust_code); return pc === d || lc(x.cust_code) === lc(t) ? 0 : d.length >= 4 && pc.startsWith(d) ? 1 : fold(x.cust_name).startsWith(f) ? 2 : 3; };
  const hits = [...acc.values()].filter(x => lc(x.cust_code) === lc(t) || (d.length >= 4 && phoneNorm(x.cust_code).startsWith(d)) || (f.length >= 2 && ws.every(w => fold((x.cust_name || '') + ' ' + x.cust_code).includes(w))))
    .map(x => ({...x, sc: score(x)})).sort((a, b) => a.sc - b.sc || (a.cust_name || '').localeCompare(b.cust_name || '')).slice(0, 30);
  return hits.map(x => { const cm = mg.get(x.cust_code), root = cm ? cm.merge_code : x.cust_code, grp = new Set([x.cust_code, root, ...merges.filter(m => m.merge_code === root).map(m => m.cust_code)]), by = new Map();
    mapping.filter(m => grp.has(m.cust_code) && (num(m.ratio) > 0 || m.status === 'proposed')).forEach(m => { const o = by.get(m.rep_name) || {rep: m.rep_name, team: m.team || 'CVRM', n: 0, b: new Set(), self: false, prop: true, direct: false, by: null, at: null};
      o.n++; o.b.add(m.brand); o.self ||= !!m.self_add; o.prop &&= m.status === 'proposed'; o.direct ||= m.cust_code === x.cust_code; if (m.added_by) o.by = nm(m.added_by); if (m.added_at && (!o.at || m.added_at > o.at)) o.at = m.added_at; by.set(m.rep_name, o); });
    const reps = [...by.values()].map(({b, ...o}) => ({...o, brands: [...b].sort().join(', ')})).sort((a, b) => b.direct - a.direct || a.rep.localeCompare(b.rep));
    return {cust_code: x.cust_code, cust_name: x.cust_name, address: x.address || null, segment: x.segment, in_raw: x.in_raw, merge_code: cm ? cm.merge_code : null, merge_name: cm ? cm.merge_name : null, reps}; });
}

// Type BV + kênh từ raw (bản 4.12): Customer Local Group 1 Desc (hoặc Channel_name) · Group 2 · Group 3
//   Type: clinic (Sub-dis clinics, Clinic Pharmacy / polyclinic) · gov (GOV'T. ENTITIES) · priv (Private entities)
//   Kênh: clinic → Clinic · BV tư → Self-pay · BV công: Khoa Dược (PharmacyDepartmnt, PMC Center) → Tender, Nhà thuốc BV (Service Pharmacy) → Self-pay
function chOfRaw(c, type){
  if (type === 'clinic') return 'Clinic'; if (type === 'priv') return 'Self-pay'; if (type !== 'gov') return null;
  const g = lc(c.cust_group) + ' ' + lc(c.channel);
  if (/pharmacy ?dep|pharmacydept|pmc|institute|khoa d/.test(g)) return 'Tender';
  if (/service pharmacy|pharmacy|nha thuoc|selfpaid/.test(g)) return 'Self-pay';
  return /nha thuoc|quay thuoc/.test(lc(nlAscii(c.cust_name))) ? 'Self-pay' : 'Tender'; }
// Mã chưa có trong raw (không có đơn trong file raw): lấy theo mã gốc merge code, rồi theo tên (PK / PM / Phòng khám → Clinic; Nhà thuốc → Self-pay; Khoa Dược → Tender)
function accSegs(){
  const out = new Map(), names = new Map(), file = new Map();
  D.mapping.forEach(m => { if (!names.has(m.cust_code)) names.set(m.cust_code, m.cust_name); if (m.channel) file.set(m.cust_code, m.channel); });
  const nm = c => lc(nlAscii(names.get(c) || CUST.get(c)?.cust_name || ''));
  const isPK = n => /^(pk|pm|pkdk|phong kham|phong mach)\b|phong kham|polyclinic|\bclinic\b/.test(n), isNT = n => /nha thuoc|quay thuoc|\bnt\b/.test(n);
  for (const code of names.keys()){
    const c = CUST.get(code); if (!c || !(c.channel || c.cust_group || c.sector)) continue;
    const type = segOf(c.channel, c.cust_group, c.sector); if (type) out.set(code, {type, ch: chOfRaw(c, type), src: 'raw'});
  }
  // Mã NTBV nằm trong merge code của BV nhưng raw ghi Sub-dis clinics (vd NT BV FV, NT BV ĐK Nhà Bè): theo type của BV, kênh Self-pay
  for (const [code, o] of out){ const mg = MERGE.get(code), root = mg && mg.merge_code !== code ? out.get(mg.merge_code) : null;
    if (root && (root.type === 'gov' || root.type === 'priv') && o.type === 'clinic' && /nha thuoc|benh vien|\bnt\b/.test(nm(code))) out.set(code, {type: root.type, ch: 'Self-pay', src: 'merge'}); }
  for (const code of names.keys()){ if (out.has(code)) continue; const n = nm(code), mg = MERGE.get(code), root = mg && mg.merge_code !== code ? out.get(mg.merge_code) : null;
    // mã gốc merge code chưa có trong raw: lấy type từ mã cùng account đã có trong raw (vd NTBV có đơn, mã Khoa Dược thì chưa)
    const sib = !root && mg && mg.merge_code === code ? [...MERGE].filter(([c, x]) => x.merge_code === code && c !== code).map(([c]) => out.get(c)).find(o => o && o.src === 'raw' && o.type !== 'clinic') : null;
    let type = root ? root.type : sib ? sib.type : isPK(n) ? 'clinic' : null, ch = null;
    if (type === 'clinic') ch = 'Clinic'; else if (type === 'priv') ch = 'Self-pay';
    else if (type === 'gov') ch = isNT(n) ? 'Self-pay' : 'Tender';
    else { const f = file.get(code); ch = isNT(n) ? 'Self-pay' : /khoa duoc/.test(n) ? 'Tender' : ['Tender', 'Self-pay', 'Clinic'].includes(f) ? f : f === 'Clinic' ? 'Clinic' : null; if (/khoa duoc/.test(n)) type = 'gov'; }
    out.set(code, {type, ch, src: root || sib ? 'merge' : type || ch ? 'name' : ''}); }
  return out;
}
function parseSeg(v){ const x = lc(norm(v)); if (!x) return null;
  if (/clinic|phòng khám|phong kham|^pk\b/.test(x)) return 'clinic';
  if (/gov|công|cong|nhà nước|nha nuoc/.test(x)) return 'gov';
  if (/priv|tư nhân|tu nhan|\btư\b|\btu\b/.test(x)) return 'priv'; return null; }
const nlAscii = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
const nlCode = name => { let c = nlAscii(name).toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-+|-+$/g, ''); if (c.length > 40) c = c.slice(0, 41).replace(/-[^-]*$/, '') || c.slice(0, 40); return 'NEW-' + c; };   // BV chưa có mã KH: cùng tên → cùng mã tạm (cắt ở ranh giới từ)
const nlBig = v => v && Math.abs(v) < 1e7 ? nf1.format(v / 1e6) + ' tr' : big(v);   // số New launch nhỏ: dưới 10 tr giữ 1 số lẻ

// Tổng hợp: số như agg() + theo kênh, theo SKU, account / MR có FC
function nlAgg(rows){
  const a = agg(rows); a.seg = {}; SEG_KEYS.forEach(k => a.seg[k] = {fcv: 0, box: 0, act: 0, acc: new Set(), accFC: new Set()});
  a.sku = new Map(); a.acc = new Set(); a.accFC = new Set(); a.reps = new Set(); a.repsFC = new Set(); a.qtdBox = 0; a.boxM = [0, 0, 0];
  for (const r of rows){ const s = a.seg[r.segment || ''] || a.seg['']; const fc = r.box > 0;
    s.fcv += r.fcv; s.box += r.box; s.act += r.act[4]; s.acc.add(r.cust_code); if (fc) s.accFC.add(r.cust_code);
    a.acc.add(r.cust_code); a.reps.add(r.rep_name); if (fc){ a.accFC.add(r.cust_code); a.repsFC.add(r.rep_name); }
    a.qtdBox += r.qty[4]; r.boxM.forEach((b, i) => a.boxM[i] += b);
    const k = a.sku.get(r.sku) || {box: 0, fcv: 0, boxM: [0, 0, 0]}; k.box += r.box; k.fcv += r.fcv; r.boxM.forEach((b, i) => k.boxM[i] += b); a.sku.set(r.sku, k); }

// Phasing: đơn BV dồn cuối quý → so Act. QTD với % sales quý thường đạt tới ngày dữ liệu (TB tối đa 8 quý gần nhất), không so với % thời gian.
function seasonality(ts){
  // Mỗi team tính phasing theo sales và ngày dữ liệu của team đó; Cả 2 team: bình quân theo quy mô sales quý gần nhất của từng team
  const s = D.settings, Y = +s.year, Q = +s.quarter; ts = ts || (typeof vTeams === 'function' ? vTeams() : [null]);
  let pSum = 0, wSum = 0, nMin = Infinity, ok = true; const shSum = [0, 0, 0];
  for (const t of ts){
    const c = (t && TC[t]) || {mst: MST, asOf: ASOF, timeGone: TIME_GONE}, byM = new Map();
    for (const r of D.sales){ if (t && (r.team || TEAMS[0]) !== t) continue; const k = +r.year * 100 + +r.month; byM.set(k, (byM.get(k) || 0) + num(r.value)); }
    const qs = []; let last = [];
    for (let y = Y - 3; y <= Y; y++) for (let q = 1; q <= 4; q++){
      if (y === Y && q >= Q) break;
      const ms = [1, 2, 3].map(i => byM.get(y * 100 + (q - 1) * 3 + i) || 0), tt = ms[0] + ms[1] + ms[2];
      last.push(tt); if (ms.every(v => v > 0)) qs.push(ms.map(v => v / tt));
    }
    const w = ts.length > 1 ? Math.max(1, last.slice(-2).reduce((a, b) => a + b, 0)) : 1, use = qs.slice(-8);

    else { const sh = [0, 1, 2].map(i => use.reduce((a, x) => a + x[i], 0) / use.length); e = 0;
      MS.forEach((m, i) => { if (c.mst[i] === 'closed') e += sh[i]; else if (c.mst[i] === 'current') e += sh[i] * Math.min(1, c.asOf.getDate() / new Date(Y, m, 0).getDate()); });
      sh.forEach((x, i) => shSum[i] += x * w); nMin = Math.min(nMin, use.length); }
    pSum += Math.min(1, e) * w; wSum += w;
  }
  if (!ok || !wSum){ SEAS = null; PACE = wSum ? pSum / wSum : TIME_GONE; if (ts.length <= 1) PACE = (ts[0] && TC[ts[0]] || {timeGone: TIME_GONE}).timeGone; return; }
  SEAS = {sh: shSum.map(x => x / wSum), n: nMin}; PACE = pSum / wSum;
}

function fyData(){

  const sq = (r, y, q) => (SQ.get(`${r.cust_code}|${r.sku}|${y}|${q}`) || [0])[0] * num(r.ratio);
  const bInfo = new Map(); D.prices.filter(p => ts.includes(p.team || TEAMS[0])).forEach(p => { const b = p.brand, o = bInfo.get(b) || {team: p.team || TEAMS[0], launch: true}; if (!p.launch) o.launch = false; bInfo.set(b, o); });
  const tSort = t => { const x = (D.teams || []).find(z => z.team === t); return x ? num(x.sort) : 99; };
  const B = new Map(), get = (b, tm) => { if (!B.has(b)) B.set(b, {b, ly: 0, fyLy: 0, qtd: 0, ytd: 0, tgt: 0, tgtFY: null, m: [0, 0, 0], ...(bInfo.get(b) || {team: tm || TEAMS[0], launch: false})}); return B.get(b); };

    for (let q = 1; q <= 4; q++) o.fyLy += sq(r, Y - 1, q); for (let q = 1; q < Q; q++) o.ytd += sq(r, Y, q); }
  if (!rep){ TGT_OPEN.forEach(t => { const b = PRICE.get(t.sku)?.brand || brandOf(t.sku); if (B.has(b) || bInfo.has(b)) get(b).tgt += num(t.value); });

  const mHd = MS.map((m, i) => MST[i] === 'closed' ? `Actual ${MON3[m - 1]}` : MST[i] === 'current' ? `Act. + FC ${MON3[m - 1]}` : `FC ${MON3[m - 1]}`);

function wkEvents(){

   8. TAB ADMIN — nạp dữ liệu, FC lịch sử, phân bổ, thành viên, xuất Excel

async function readWorkbook(file, sheets){ await getXLSX(); return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = e => { try { res(XLSX.read(new Uint8Array(e.target.result), {type: 'array', cellDates: false, ...(sheets ? {sheets} : {})})); } catch(err){ rej(err); } }; fr.onerror = rej; fr.readAsArrayBuffer(file); }); }
function sheetRows(ws){ return XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: null, blankrows: false}); }
function findHeader(rows, mustHave){ for (let i = 0; i < Math.min(rows.length, 30); i++){ const r = (rows[i] || []).map(lc); if (mustHave.every(h => r.includes(lc(h)))) return i; } return -1; }
// Địa chỉ khách hàng trong raw (bản 4.21): 1 cột địa chỉ đầy đủ (Customer Address, Ship-to Address, Địa chỉ…),
// không có thì ghép các cột Street / Ward / District / City / Province. Trả {cols: tên cột dùng, of(row): địa chỉ}
function addrCols(hdr){
  const h = hdr.map(x => fold(String(x ?? ''))), ok = x => x && !/mail|ip address|web|code|ma /.test(x);
  const score = x => /address|dia chi/.test(x) ? (/customer|khach|ship|sold|deliver|giao/.test(x) ? 3 : /full|day du/.test(x) ? 2 : 1) : 0;
  let best = -1; h.forEach((x, i) => { if (ok(x) && score(x) && (best < 0 || score(x) > score(h[best]))) best = i; });
  const pick = best >= 0 ? [best] : ['street|so nha|duong', 'ward|phuong|xa', 'district|quan|huyen', 'city|province|tinh|thanh pho']
    .map(re => h.findIndex(x => ok(x) && new RegExp(`(^|[^a-z])(${re})([^a-z]|$)`).test(x) && !/group|channel|region|area|vung|trang/.test(x))).filter((i, k, a) => i >= 0 && a.indexOf(i) === k);
  return {cols: pick.map(i => norm(hdr[i])), of: r => pick.map(i => norm(r[i])).filter(Boolean).join(', ')};
}
function colIdx(hdr, names){ const h = hdr.map(lc); for (const n of names){ const i = h.indexOf(lc(n)); if (i >= 0) return i; } return -1; }
function findSheet(wb, prefer, mustHave){ for (const n of [...prefer, ...wb.SheetNames]){ if (!wb.Sheets[n]) continue; const rows = sheetRows(wb.Sheets[n]); const hi = findHeader(rows, mustHave); if (hi >= 0) return {rows, hi, hdr: rows[hi]}; } return null; }

// Merge code: file Commex (sheet Mapping Channel: Customer Code · Merge Code2 · Merge Name 1) hoặc file merge xuất từ app
// (Merge Code · Merge Name · Customer Code). Thay toàn bộ danh sách merge; chỉ giữ nhóm từ 2 mã, mã gốc tự thêm nếu file thiếu.
async function importMerges(file, log){
  const wb = await readWorkbook(file); const f = findSheet(wb, ['Merge code', 'Mapping Channel'], ['Customer Code']);
  if (!f) throw new Error('Không thấy cột Customer Code');
  const h = f.hdr, c = {code: colIdx(h, ['Customer Code']), mc: colIdx(h, ['Merge Code', 'Merge Code2', 'Merge Code1']), mn: colIdx(h, ['Merge Name', 'Merge Name 1', 'Tên sau Merge']), src: colIdx(h, ['Nguồn', 'Source']), note: colIdx(h, ['Ghi chú', 'Note'])};
  if (c.mc < 0) throw new Error('Không thấy cột Merge Code');
  const by = new Map();
  for (let i = f.hi + 1; i < f.rows.length; i++){ const r = f.rows[i] || []; const code = norm(r[c.code]), mc = norm(r[c.mc]); if (!code || !mc) continue;
    by.set(code, {cust_code: code, merge_code: mc, merge_name: c.mn >= 0 ? norm(r[c.mn]) : '', source: c.src >= 0 ? norm(r[c.src]) || 'File' : 'Commex', note: c.note >= 0 ? norm(r[c.note]) : ''}); }
  const groups = new Map(); for (const m of by.values()){ if (!groups.has(m.merge_code)) groups.set(m.merge_code, []); groups.get(m.merge_code).push(m); }
  const list = [];
  for (const [mc, ms] of groups){
    if (!ms.some(m => m.cust_code === mc)){ if (by.has(mc)) continue; ms.push({cust_code: mc, merge_code: mc, merge_name: ms[0].merge_name, source: ms[0].source, note: 'merge code (mã gốc)'}); }   // mã gốc nằm ở nhóm khác: bỏ nhóm lỗi
    if (ms.length < 2) continue;
    const nm = ms.find(m => m.cust_code === mc && m.merge_name)?.merge_name || ms.find(m => m.merge_name)?.merge_name || '';
    ms.forEach(m => { m.merge_name = nm; list.push(m); }); }
  if (!list.length) throw new Error('File không có nhóm merge nào (cần ít nhất 2 mã cùng merge code)');
  await STORE.saveMerges(list);
  const app = new Set(D.mapping.map(m => m.cust_code)), inApp = list.filter(m => app.has(m.cust_code)), gApp = new Set(inApp.map(m => m.merge_code)).size;
  log(`Merge code: ${nf0.format(groups.size ? new Set(list.map(m => m.merge_code)).size : 0)} nhóm, ${nf0.format(list.length)} mã. Trên app: ${nf0.format(inApp.length)} mã thuộc ${nf0.format(gApp)} merge code. Đã thay danh sách merge cũ.`);
}

function fcFileCols(hdr){

  hdr.forEach((h, i) => { const x = lc(h); let m;
    if ((m = x.match(/^fc\s+([a-z]+)\s+từ\s+(\d{1,2})\/(\d{1,2})\s*\(box\)$/)) && MON[m[1]]){ cols.push({i, mo: MON[m[1]], rem: `${m[2].padStart(2, '0')}/${m[3].padStart(2, '0')}`}); return; }
    if ((m = x.match(/^fc\s+([a-z]+)\s*\(box\)$/)) && MON[m[1]]){ cols.push({i, mo: MON[m[1]]}); return; }
    if ((m = x.match(/^fc tháng\s*([123])\s*\(box\)$/))){ cols.push({i, mo: +m[1]}); rel = true; } });

  if (new Set(cols.map(c => c.mo)).size !== cols.length) return {cols: [], err: 'File có 2 cột FC cho cùng một tháng'};

      toast('Đã lưu hạn nộp FC tuần'); await reload(); } catch(e){ toast('Lỗi: ' + e.message); } });
    bindPromo();
    $('#pr-add').onclick = () => $('#pr').insertAdjacentHTML('beforeend', prRow({sku: '', brand: '', price: '', team: VIEW.team === 'ALL' ? TEAMS[0] : VIEW.team}));
    $('#pr-raw').onclick = () => { let n = 0; $$('#pr tr').forEach(r => { const sg = SG.get(norm($('[data-c=sku]', r).value)); if (!sg || !sg.base) return; const b = sg.base.p; $('[data-c=price]', r).value = b;
        PCH.forEach(pc => { const x = sg.ch[pc]; $(`[data-c="${PCH_KEY[pc]}"]`, r).value = x && Math.abs(x.p - b) / b > 0.002 ? x.p : ''; }); n++; });
      toast(n ? `Đã điền giá theo raw cho ${n} SKU. Xem lại rồi bấm Lưu.` : 'Chưa có raw sales 2 quý gần nhất để lấy giá'); };
    $('#pr-save').onclick = async () => { const list = $$('#pr tr').map(r => ({sku: norm($('[data-c=sku]', r).value), brand: norm($('[data-c=brand]', r).value).toUpperCase() || brandOf(norm($('[data-c=sku]', r).value)), price: num($('[data-c=price]', r).value), ...Object.fromEntries(PCH.map(pc => [PCH_KEY[pc], num($(`[data-c="${PCH_KEY[pc]}"]`, r).value) || null])), team: $('[data-c=team]', r).value, launch: $('[data-c=launch]', r).checked})).filter(p => p.sku && (p.price || p.launch)); try { await STORE.savePrices(list); toast('Đã lưu giá'); await reload(); } catch(e){ toast('Lỗi: ' + e.message); } };
  }
}
// Admin → Thành viên & giá: hạn nộp FC tuần theo team + danh sách CFO (bản 4.19)
const wkSetHtml = () => `<div class="card wide"><h3>Hạn nộp FC tuần & CFO</h3><div class="sub" style="margin-bottom:8px">Giờ Việt Nam. MR bấm Submit trong 6 ngày trước hạn = đúng giờ, trong 24 giờ sau hạn = trễ, quá 24 giờ = không nộp. CFO: tick cột CFO ở bảng Thành viên (MR) rồi Lưu; CFO xem Dashboard → FC tuần của team mình. Admin, RFFM xem Dashboard → FC tuần.</div>
  <div class="tw"><table class="t"><thead><tr><th class="l">Team</th><th class="l">Hạn nộp</th><th class="l">Giờ</th><th class="l" data-tip="Theo dõi các hạn từ ngày này (tối đa 13 tuần gần nhất)">Theo dõi từ</th><th class="l">CFO</th></tr></thead><tbody>${TEAMS.map(t => { const c = wkCfg(t), cf = D.members.filter(m => m.cfo && m.role === 'MR' && memTeam(m) === t).map(m => m.rep_name);
    return `<tr data-wkt-row="${esc(t)}"><td class="l"><b>${esc(teamName(t))}</b></td><td class="l"><select data-c="dow">${[1, 2, 3, 4, 5, 6, 7].map(d => `<option value="${d}" ${d === c.dow ? 'selected' : ''}>${DOW_VN[d][0].toUpperCase() + DOW_VN[d].slice(1)}</option>`).join('')}</select></td><td class="l"><input type="time" data-c="time" value="${c.time}" step="60"></td><td class="l"><input type="date" data-c="from" value="${c.from || ''}"></td><td class="l">${cf.length ? esc(cf.join(', ')) : '<span class="muted">chưa chọn</span>'}</td></tr>`; }).join('')}</tbody></table></div>
  <div class="bar" style="margin-top:8px">${wkOn() ? '' : '<span class="warn">Database chưa ở bản 13: chạy migration_v13.sql để lưu được.</span>'}<span class="grow"></span><button class="btn pri" id="wk-save" ${wkOn() ? '' : 'disabled'}>Lưu hạn nộp</button></div></div>`;
const memRow = m => `<tr><td class="l"><input data-c="email" value="${esc(m.email)}" placeholder="email" style="width:190px"></td><td class="l"><input data-c="rep" value="${esc(m.rep_name)}" style="width:170px"></td><td class="l"><select data-c="role">${['MR', 'RFFM', 'ADMIN'].map(r => `<option ${r === m.role ? 'selected' : ''}>${r}</option>`).join('')}</select></td><td class="l"><select data-c="team">${[...TEAMS, 'ALL'].map(t => `<option value="${t}" ${t === memTeam(m) ? 'selected' : ''}>${t === 'ALL' ? 'Cả 2 team' : esc(teamName(t))}</option>`).join('')}</select></td><td style="text-align:center"><input type="checkbox" data-c="cfo" ${m.cfo ? 'checked' : ''} ${wkOn() ? '' : 'disabled title="Cần database bản 13"'} aria-label="CFO"></td><td><button class="btn sm danger" data-rm>✕</button></td></tr>`;
const prHint = x => x ? `<div class="sub prh" data-tip="Raw: ${nf0.format(x.n)} dòng khách × tháng, ${pct(x.share)} cùng giá này">raw ${nf0.format(x.p)} · ${pct(x.share)}</div>` : '';
const prRow = (p, sg) => `<tr><td class="l"><input data-c="sku" value="${esc(p.sku)}" style="width:190px"></td><td class="l"><input data-c="brand" value="${esc(p.brand)}" style="width:80px"></td><td><input data-c="price" value="${p.price || ''}" placeholder="${p.launch ? 'chưa có' : ''}" style="width:96px;text-align:right">${prHint(sg?.base)}</td>${PCH.map(pc => `<td><input data-c="${PCH_KEY[pc]}" value="${num(p[PCH_KEY[pc]]) || ''}" placeholder="= chung" style="width:96px;text-align:right">${prHint(sg?.ch[pc])}</td>`).join('')}<td class="l"><select data-c="team">${TEAMS.map(t => `<option value="${t}" ${t === (p.team || TEAMS[0]) ? 'selected' : ''}>${esc(teamName(t))}</option>`).join('')}</select></td><td style="text-align:center"><input type="checkbox" data-c="launch" ${p.launch ? 'checked' : ''} aria-label="New launch"></td></tr>`;

boot().catch(e => { $('#app').innerHTML = `<div class="login"><h1>Lỗi khởi động</h1><div class="msg err">${esc(e.message || e)}</div></div>`; });

/* ---------- Bấm tiêu đề cột để sắp xếp (bản 4.16, như Power BI) ----------
   Áp cho mọi bảng .t: lần 1 số lớn → nhỏ (chữ A → Z), lần 2 đảo lại. Dòng Total / Subtotal / tiêu đề nhóm đứng yên;
   bảng có cấp (merge code → mã KH → SKU, brand → kênh) sắp theo dòng cha, dòng con đi theo. Bảng vẽ lại vẫn giữ cách sắp. */
const SORT_ST = new Map();
const sortFixed = tr => /\b(tot|stot|fysub|fynlh|nlsegh)\b/.test(tr.className) || (tr.cells.length === 1 && tr.cells[0].colSpan > 2);
const sortParent = tr => /\b(mg|dgrp|bvt)\b/.test(tr.className) || (/\bacc\b/.test(tr.className) && !/\bmcode\b/.test(tr.className));
const sortHead = t => t.tHead ? [...t.tHead.rows].filter(r => !r.classList.contains('stot')).pop() : null;   // FC Input: dòng Subtotal nằm trong thead
const sortKey = t => [...t.classList].filter(c => c !== 't').join('.') + '|' + [...(sortHead(t)?.cells || [])].map(c => c.textContent.trim()).join('|');
function sortCell(tr, col){ let x = 0; for (const c of tr.cells){ if (col >= x && col < x + c.colSpan) return c; x += c.colSpan; } return null; }
function sortVal(c){
  if (!c) return null; const inp = c.querySelector('input'); let t = (inp ? inp.value : c.textContent).trim();
  if (!t || /^[–—-]$/.test(t)) return null;
  const n = t.replace(/[−–]/g, '-').replace(/[↑↓▲▼,%\s]|tr\b|tỷ|box/g, '').replace(/^\+/, '');
  if (/^-?\d+(\.\d+)?$/.test(n)) return +n;
  const d = t.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (d) return +new Date(+d[3], d[2] - 1, +d[1]);
  return t.toLowerCase();
}
function applySort(t){
  const st = SORT_ST.get(sortKey(t)); const hr = sortHead(t); if (!hr) return;
  [...hr.cells].forEach(h => h.removeAttribute('data-sort'));
  if (!st) return;
  let col = 0, th = null; for (const h of hr.cells){ if (col === st.col){ th = h; break; } col += h.colSpan; } if (!th) return;
  th.setAttribute('data-sort', st.dir);
  for (const tb of t.tBodies){
    const rows = [...tb.rows]; if (rows.length < 2) continue;
    const hasP = rows.some(sortParent), out = []; let seg = [], blk = null;
    const flush = () => { if (blk) seg.push(blk); blk = null;
      const isNum = seg.some(b => typeof b.v === 'number');
      seg.sort((a, b) => a.v === null && b.v === null ? a.i - b.i : a.v === null ? 1 : b.v === null ? -1
        : (typeof a.v === typeof b.v ? (a.v < b.v ? -1 : a.v > b.v ? 1 : 0) : typeof a.v === 'number' ? -1 : 1) * (st.dir === 'asc' ? 1 : -1) || a.i - b.i);
      seg.forEach(b => out.push(...b.rows)); seg = []; };
    rows.forEach((tr, i) => {
      if (sortFixed(tr)){ flush(); out.push(tr); return; }
      if (!hasP || sortParent(tr) || !blk){ if (blk) seg.push(blk); blk = {i, rows: [tr], v: sortVal(sortCell(tr, st.col))}; }
      else blk.rows.push(tr);
    });
    flush();
    if (out.some((r, i) => r !== rows[i])) out.forEach(r => tb.appendChild(r));
  }
}
document.addEventListener('click', e => {
  const th = e.target.closest('table.t > thead > tr > th'); if (!th || e.target.closest('a,button,input,select')) return;
  const t = th.closest('table'), hr = th.parentElement; if (hr !== sortHead(t)) return; if (!th.textContent.trim() || th.classList.contains('nosort')) return;
  let col = 0; for (const h of hr.cells){ if (h === th) break; col += h.colSpan; }
  const k = sortKey(t), cur = SORT_ST.get(k);
  const first = t.tBodies[0] ? [...t.tBodies[0].rows].filter(r => !sortFixed(r)).map(r => sortVal(sortCell(r, col))).find(v => v !== null) : null;
  const d0 = typeof first === 'string' ? 'asc' : 'desc';
  SORT_ST.set(k, {col, dir: cur && cur.col === col ? (cur.dir === 'desc' ? 'asc' : 'desc') : d0});
  applySort(t);
});
// Bảng vẽ lại (đổi bộ lọc, làm mới, nhập FC) → sắp lại theo cột đã chọn
new MutationObserver(ms => { const ts = new Set(); for (const m of ms) for (const n of m.addedNodes){ if (n.nodeType !== 1) continue;
    if (n.matches?.('table.t')) ts.add(n); n.querySelectorAll?.('table.t').forEach(t => ts.add(t)); const p = n.closest?.('table.t'); if (p && n.tagName === 'TBODY') ts.add(p); }
  ts.forEach(t => { if (SORT_ST.has(sortKey(t))) applySort(t); }); }).observe(document.body, {childList: true, subtree: true});
</script>
